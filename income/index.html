<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<script>window.API_BASE="https://sterile-postcard-crazily.ngrok-free.dev/income";</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Облік перепродажу</title>
<!-- Шрифт — системний SF Pro (Apple): без зовнішніх шрифтів, швидше й рідніше. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   Облік перепродажу — Apple dark. Чистий чорний, SF Pro
   (системний), білий акцент; зелений/червоний лише для даних.
   ============================================================ */
:root{
  --ink:#000000;                        /* фон сторінки */
  --panel:#1c1c1e; --panel-2:#2c2c2e; --panel-3:#3a3a3c;
  --line:rgba(84,84,88,.4);
  --text:#ffffff;
  --muted:rgba(235,235,245,.6);
  --faint:rgba(235,235,245,.3);
  --amber:#ffffff;        /* колишній акцент — тепер білий */
  --amber-soft:#e5e5ea;
  --mint:#30d158; --coral:#ff453a; --sky:#0a84ff;
  --ring-track:#1c1c1e;
  --shadow:0 12px 32px -16px rgba(0,0,0,.8);
  --r:18px; --r-sm:14px; --nav-h:58px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fmono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace;
  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--text); font-family:var(--font); line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + var(--nav-h) + 20px);
  max-width:480px; margin:0 auto; overflow-x:hidden; min-height:100vh;
  overscroll-behavior-y:none;
}
.mono{font-family:var(--fmono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cur{font-size:.6em;color:var(--faint);margin-right:1px;vertical-align:.08em;font-weight:600}
.eyebrow{font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.top h1{font-weight:700;font-size:22px;letter-spacing:-.5px;line-height:1.15}
.top .live{display:flex;align-items:center;gap:6px;margin-top:4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}
.top .live span{font-size:11px;color:var(--faint)}
.who-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--panel);border-radius:100px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);transition:transform .1s,background .15s}
.who-btn:active{transform:scale(.96)}
.who-btn.on{background:var(--text);color:#000}
.viewing .nav [data-tab="add"]{display:none}
.u-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);margin-top:8px;transition:background .15s}
.u-row.on{background:rgba(255,255,255,.14)}
.u-row .nm{font-weight:600;font-size:15px}
.u-row .sub{font-size:12px;color:var(--faint);margin-top:2px}
.u-row .pf{font-weight:600;font-size:14px;white-space:nowrap}
.cur-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:100px;padding:9px 14px;transition:transform .1s ease-out,background .15s}
.cur-btn:active{transform:scale(.94);background:var(--panel-2)}
.cur-btn .sym{font-family:var(--fmono);font-weight:700;font-size:17px;color:var(--text);line-height:1}
.cur-btn .lb{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;line-height:1.2}
.cur-btn .lb b{display:block;color:var(--muted);font-weight:600;font-size:10px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--panel);border-radius:100px;padding:8px 15px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:transform .1s,background .18s,color .18s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--text);color:#000;font-weight:600}

/* каскадна поява */
.reveal{opacity:0;transform:translateY(10px);animation:rise .45s var(--ease) forwards}
.reveal:nth-of-type(2){animation-delay:.05s}
.reveal:nth-of-type(3){animation-delay:.1s}
.reveal:nth-of-type(4){animation-delay:.15s}
@keyframes rise{to{opacity:1;transform:none}}

/* hero gauge — біла шкала на графіті */
.hero{position:relative;background:var(--panel);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:12px;overflow:hidden}
.gauge-wrap{position:relative;width:216px;height:216px;margin:2px auto 4px}
.gauge{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .track{fill:none;stroke:var(--panel-2);stroke-width:13}
.gauge .prog{fill:none;stroke:url(#g-amber);stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);transition:stroke-dashoffset 1.1s var(--ease);filter:drop-shadow(0 0 6px rgba(255,255,255,.22))}
.tick{stroke:rgba(255,255,255,.06);stroke-width:2}.tick.maj{stroke:rgba(255,255,255,.16);stroke-width:2.5}
.gauge-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.gauge-core .lbl{font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;max-width:150px}
.gauge-core .val{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:700;font-size:38px;letter-spacing:-1.2px;line-height:1}
.gauge-core .val.neg{color:var(--coral)}
.gauge-core .val .cur{font-size:18px;color:var(--faint);vertical-align:.24em}
.gauge-core .margin{margin-top:7px;font-size:12px;color:var(--muted);font-weight:600}
.hero-sub{display:flex;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.hero-sub .cell{flex:1;text-align:center;position:relative}
.hero-sub .cell+.cell::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.hero-sub .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.hero-sub .v{font-weight:600;font-size:16px;font-family:var(--fmono);font-variant-numeric:tabular-nums}
.delta{margin-top:11px;font-size:12.5px;text-align:center;color:var(--muted)}
.delta .up{color:var(--mint);font-weight:600}.delta .down{color:var(--coral);font-weight:600}

/* field grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.field{background:var(--panel);border-radius:var(--r-sm);padding:12px 11px}
.field .fv{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;line-height:1;letter-spacing:-.3px}
.field .fv .u{font-size:11px;color:var(--faint);font-weight:500;margin-left:2px;font-family:var(--font)}
.field .fk{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.field.hl .fv{color:var(--text)}

/* section */
.section{background:var(--panel);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-head .r{font-size:11px;color:var(--faint)}

/* chart — білі стовпчики, обраний = 100% білого */
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer}
.bar-val{font-size:9px;color:var(--faint);font-family:var(--fmono)}
.bar-track{width:100%;flex:1;display:flex;align-items:flex-end}
.bar{width:100%;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.3);min-height:3px;transition:height .8s var(--ease),background .2s}
.bar.zero{background:var(--panel-2)}
.bar.sel{background:var(--text)}
.bar-x{font-size:10px;color:var(--faint);font-weight:500}
.bar-x.sel{color:var(--text);font-weight:600}
.avg-line{display:flex;gap:16px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;flex-wrap:wrap}
.avg-line .a{font-size:11.5px;color:var(--muted)}.avg-line .a b{color:var(--text);font-weight:600;font-family:var(--fmono)}

/* best */
.best{background:var(--panel);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.best .trophy{position:absolute;top:-6px;right:6px;font-size:60px;opacity:.09;transform:rotate(8deg)}
.best .eyebrow{color:var(--mint)}
.best .m{font-weight:700;font-size:18px;letter-spacing:-.3px;margin:8px 0 2px}
.best .p{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:700;font-size:27px;letter-spacing:-.5px;color:var(--mint)}
.best .p .cur{color:var(--mint);opacity:.7}

/* заморожені гроші — вкладено в наявні товари (sky = «інвестовано») */
.frozen{background:var(--panel);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.frozen .snow{position:absolute;top:-8px;right:6px;font-size:58px;opacity:.09;transform:rotate(-8deg)}
.frozen .eyebrow{color:var(--sky)}
.frozen .fz{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:700;font-size:28px;letter-spacing:-.6px;color:var(--sky);margin:8px 0 3px;line-height:1}
.frozen .fz .cur{font-size:18px;color:var(--sky);opacity:.7;vertical-align:.06em}
.frozen .fzsub{font-size:12px;color:var(--muted);font-weight:500}

/* кольорові варіанти стовпчиків в Аналітиці */
.bar.exp{background:rgba(255,69,58,.5)}
.bar.days{background:rgba(10,132,255,.55)}
.bar.rev{background:rgba(48,209,88,.5)}
.a-cap{font-size:11px;color:var(--faint);margin:-4px 0 12px}

/* рядки-інсайти (швидкість обороту) */
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.stat-row:first-of-type{border-top:none}
.stat-row .sl{font-size:13.5px;color:var(--muted)}
.stat-row .sl b{color:var(--text);font-weight:500}
.stat-row .sv{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
.stat-row .sv.fast{color:var(--mint)}.stat-row .sv.slow{color:var(--coral)}

/* ціль місяця */
.goal-set{display:block;width:100%;background:var(--panel);border-radius:var(--r);padding:14px;margin-bottom:12px;color:var(--muted);font-size:14px;font-weight:600;text-align:center;transition:transform .1s ease-out,background .15s}
.goal-set:active{transform:scale(.98);background:var(--panel-2)}
.goal{background:var(--panel);border-radius:var(--r);padding:15px 18px;margin-bottom:12px;cursor:pointer}
.goal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.goal-amt{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
.goal-bar{height:10px;border-radius:100px;background:var(--panel-2);overflow:hidden}
.goal-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#0a84ff,#30d158);transition:width .9s var(--ease)}
.goal-fill.done{background:var(--mint)}
.goal-sub{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:500}

/* прогноз місяця */
.fc{background:var(--panel);border-radius:var(--r);padding:15px 18px 16px;margin-bottom:12px}
.fc.tap{cursor:pointer;transition:transform .1s ease-out}
.fc.tap:active{transform:scale(.99)}
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fc-day{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--faint);white-space:nowrap}
.fc-val{display:flex;align-items:baseline;gap:3px;font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1;margin:10px 0 6px}
.fc-val .ap{font-size:20px;color:var(--faint);font-weight:600;margin-right:2px}
.fc-val .cur{font-size:19px;color:var(--muted)}
.fc-verdict{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.45;margin-bottom:13px}
.fc-verdict b{font-weight:700;color:var(--text)}
.fc-verdict.ok b{color:var(--mint)}
.fc-verdict.bad b{color:var(--coral)}
.fc-bar{position:relative;height:10px;border-radius:100px;background:var(--panel-2);overflow:hidden;margin-bottom:9px}
.fc-bar i{position:absolute;top:0;bottom:0;border-radius:100px;transition:width .9s var(--ease),left .9s var(--ease)}
.fc-bar i.now{left:0;background:#fff}
.fc-bar i.proj{background:repeating-linear-gradient(115deg,rgba(255,255,255,.30) 0 5px,rgba(255,255,255,.09) 5px 10px)}
.fc-bar i.gm{width:2px;border-radius:2px;background:var(--sky);z-index:2}
.fc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.fc-legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}
.fc-legend i.k-now{background:#fff}
.fc-legend i.k-proj{background:repeating-linear-gradient(115deg,rgba(255,255,255,.45) 0 3px,rgba(255,255,255,.12) 3px 6px)}
.fc-legend i.k-goal{background:var(--sky)}
.fc-rows{margin-top:6px}
.fc-note{font-size:11.5px;color:var(--faint);line-height:1.55;margin-top:11px}
.fc-note.warn{color:var(--muted)}

/* майстер додавання */
.opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint);font-size:10px}
.name-preview{background:var(--panel-2);border-radius:12px;padding:11px 13px;margin-top:8px;font-size:14px;color:var(--muted)}
.name-preview b{color:var(--text);font-weight:600}

/* залежані товари */
.stale-seg{display:flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:3px}
.stale-seg button{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.stale-seg button.on{background:var(--panel-3);color:var(--text)}
.stale-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.stale-row:first-of-type{border-top:none}
.stale-row .sn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stale-row .sd{font-size:11.5px;color:var(--coral);margin-top:2px;font-weight:600}
.stale-row .sm{font-family:var(--fmono);font-weight:600;font-size:14px;color:var(--sky);white-space:nowrap}

/* кнопка експорту */
.export-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:600;font-size:15px;background:var(--panel);color:var(--text);margin-bottom:12px;transition:transform .1s ease-out,background .15s}
.export-btn:active{transform:scale(.98);background:var(--panel-2)}

/* items list */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;transition:transform .1s ease-out}
.item:first-of-type{border-top:none}
.item:active{transform:scale(.985)}
.item .ic{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:18px}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{text-align:right;flex-shrink:0}
.item .amt .n{font-weight:600;font-size:15px;font-family:var(--fmono);font-variant-numeric:tabular-nums}
.item .amt .n.pos{color:var(--mint)}.item .amt .n.inv{color:var(--sky)}
.item .amt .t{font-size:9.5px;color:var(--faint);margin-top:1px;text-transform:uppercase;letter-spacing:.06em}
.badge{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:100px}
.badge.sold{background:rgba(48,209,88,.16);color:var(--mint)}
.badge.active{background:rgba(255,255,255,.12);color:var(--text)}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:34px 10px;line-height:1.6}

/* пошук у товарах */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;background:var(--panel);border:1px solid transparent;border-radius:12px;padding:12px 40px;color:var(--text);font-family:var(--font);font-size:16px;transition:border-color .15s}
.search input:focus{outline:none;border-color:rgba(255,255,255,.28)}
.search input::placeholder{color:var(--faint)}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:var(--faint);pointer-events:none}
.search .sx{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--panel-3);color:var(--muted);font-size:14px;line-height:24px;text-align:center;display:none}
.search.has .sx{display:block}
.hit{background:rgba(255,255,255,.22);border-radius:4px;padding:0 1px}
.found{font-size:11.5px;color:var(--faint);padding:0 2px 8px;font-weight:500}

/* капітал: наскільки ефективно працюють гроші */
.cap-seg{display:flex;gap:4px;background:var(--panel-2);border-radius:10px;padding:3px}
.cap-seg button{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.cap-seg button.on{background:var(--panel-3);color:var(--text)}
.cap-note{font-size:11.5px;color:var(--faint);line-height:1.55;margin-top:12px}
.hold-row{padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.hold-row:first-of-type{border-top:none}
.hold-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hold-row .hn{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hold-row .hv{font-family:var(--fmono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:var(--sky);white-space:nowrap}
.hold-row .hd{font-size:11.5px;color:var(--faint);margin-top:3px}
.hold-bar{height:4px;border-radius:100px;background:var(--panel-2);margin-top:7px;overflow:hidden}
.hold-bar>i{display:block;height:100%;background:var(--sky);border-radius:100px;transition:width .8s var(--ease)}

/* forms */
.form label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:14px 0 7px;font-weight:600}
.form input,.form select{width:100%;background:var(--panel-2);border:1px solid transparent;border-radius:12px;padding:13px 14px;color:var(--text);font-family:var(--font);font-size:16px;transition:border-color .15s}
.form input:focus,.form select:focus{outline:none;border-color:rgba(255,255,255,.35)}
.form input::placeholder{color:var(--faint)}
.form .row{display:flex;gap:9px}.form .row>*{flex:1}
.plat{display:flex;gap:8px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:16px;transition:transform .1s ease-out,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--text);color:#000}
.btn.ghost{background:var(--panel-2);color:var(--text)}
.btn.danger{background:rgba(255,69,58,.15);color:var(--coral)}
.btn.mint{background:var(--mint);color:#003117}
.btn-row{display:flex;gap:9px;margin-top:16px}.btn-row>*{flex:1}

/* detail sheet — iOS-пружина */

<script>
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// Авторизація: у Telegram — initData (визначає користувача), у браузері — demo-пісочниця
const INIT = (TG && TG.initData) ? TG.initData : '';
// Чию статистику дивимось: null — свою. Чужу сервер віддає лише власнику бота
// (для інших параметр ігнорується). Можна відкрити одразу з бота: ?view=<id>.
let VIEW = new URLSearchParams(location.search).get('view') || null;
function authQS(){ return (INIT ? ('initData=' + encodeURIComponent(INIT)) : 'demo=1') + (VIEW ? '&view='+encodeURIComponent(VIEW) : ''); }
function authBody(o){ const b = INIT ? {...o, initData: INIT} : {...o, demo: 1}; if(VIEW) b.view = VIEW; return b; }
// Базовий префікс, коли роздається за проксі (напр. "/income"). У корені — порожній.
// Якщо сторінку віддає статичний хост (GitHub Pages), деплой вшиває window.API_BASE —
// повну адресу API на ПК (https://<домен>/income). Інакше беремо шлях поточної сторінки.
const BASE = (window.API_BASE ? String(window.API_BASE).replace(/\/+$/, '') : '')
  || location.pathname.replace(/\/(index\.html)?$/, '');
// Обхід ngrok-попередження на XHR/fetch (безкоштовний тариф показує interstitial).
const NGROK_HDR = {'ngrok-skip-browser-warning':'1'};
const CUR = {UAH:'₴', USD:'$', EUR:'€'};
const CUR_ORDER = ['UAH','USD','EUR'];
const CUR_LB = {UAH:'грн', USD:'USD', EUR:'EUR'};
const MON = {1:'Січень',2:'Лютий',3:'Березень',4:'Квітень',5:'Травень',6:'Червень',7:'Липень',8:'Серпень',9:'Вересень',10:'Жовтень',11:'Листопад',12:'Грудень'};
const MON3 = {1:'Січ',2:'Лют',3:'Бер',4:'Кві',5:'Тра',6:'Чер',7:'Лип',8:'Сер',9:'Вер',10:'Жов',11:'Лис',12:'Гру'};

const S = {data:null, cur:'UAH', period:null, tab:'overview', filter:'all', openId:null, animKey:null,
  add:null, staleDays:30,
  q:'', capWin:'d90', itemsPeriod:'all', itemsMode:'m', itemsPlatform:'all', itemsSort:'date',
  itemsCat:'all', itemsAttr:{},   // фільтр категорії ('all'|'none'|id) і полів {fid: значення | {from,to}}
  modal:null,                     // відкрита шторка, що переживає load(): 'cats' | 'arrange' | 'ask'
  catEd:null, optEdit:null, nfType:'list', ask:null, ed:null, sellVar:null, _fv:{}};

function haptic(k){ try{ if(TG&&TG.HapticFeedback) TG.HapticFeedback.impactOccurred(k||'light'); }catch(e){} }
function hnotify(t){ try{ if(TG&&TG.HapticFeedback) TG.HapticFeedback.notificationOccurred(t); }catch(e){} }

function fmtNum(n){ const r=Math.round(n); return r.toLocaleString('uk-UA').replace(/[  ,]/g,' '); }
function conv(uah){ return S.cur==='UAH' ? uah : uah/((S.data.rates||{})[S.cur]||1); }
function money(uah){ return `<span class="cur">${CUR[S.cur]}</span>${fmtNum(conv(uah))}`; }
function isoUA(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function mkey(iso){ return iso ? iso.slice(0,7) : null; }
function mlabel(key){ const [y,m]=key.split('-'); return `${MON[+m]} ${y}`; }

// ---------- категорії й поля (усе — власне, у кожного користувача своє) ----------
function cats(){ return (S.data&&S.data.categories)||[]; }
function catById(id){ return cats().find(c=>c.id===+id)||null; }
function fieldMeta(fid){ return ((S.data&&S.data.fields)||{})[String(fid)]||null; }
// значення для показу: число — з одиницею («128 ГБ»)
function fval(fid, v){ const f=fieldMeta(fid); return (f&&f.type==='number'&&f.unit) ? `${v} ${f.unit}` : String(v); }
// поля партії для картки: «Пам'ять: 128 ГБ · IMEI: 3567» (без видалених полів)
function attrPairs(attrs){
  return Object.entries(attrs||{}).filter(([fid])=>{ const f=fieldMeta(fid); return f&&!f.deleted; })
    .map(([fid,v])=>[fieldMeta(fid).name, fval(fid,v)]);
}
function hasVariants(i){ return !!(i.variants&&i.variants.length); }
function liveVariants(i){ return (i.variants||[]).filter(v=>v.remaining>0); }
// усі значення поля fid у товарі: рівень партії + варіанти (onlyStock — лише з залишком)
function itemFieldVals(i, fid, onlyStock){
  const k=String(fid), out=[];
  if(i.attrs&&i.attrs[k]!=null) out.push(i.attrs[k]);
  (i.variants||[]).forEach(v=>{ if(v.attrs[k]!=null && (!onlyStock || v.remaining>0)) out.push(v.attrs[k]); });
  return out;
}
function uncategorized(){ return (S.data.items||[]).filter(i=>!i.category_id); }
// шторка, яка не зникає після load(): перемальовуємо вміст, зберігаючи прокрутку
function showModal(id, inner, closeFn){
  const host=document.getElementById('sheet-host');
  const old=document.getElementById(id);
  if(old){ const sh=old.querySelector('.sheet'), top=sh.scrollTop; sh.innerHTML=inner; sh.scrollTop=top; return; }
  host.innerHTML=`<div class="overlay" id="${id}" onclick="if(event.target===this)${closeFn}()"><div class="sheet">${inner}</div></div>`;
  requestAnimationFrame(()=>{const o=document.getElementById(id); if(o)o.classList.add('on');});
  setTimeout(()=>{const o=document.getElementById(id); if(o&&!o.classList.contains('on'))o.classList.add('on');},60);
}
function hideModal(id){
  S.modal=null;
  const o=document.getElementById(id);
  if(o){ o.classList.remove('on'); setTimeout(()=>{ if(!S.modal && S.openId==null) document.getElementById('sheet-host').innerHTML=''; else renderSheet(); },260); }
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ---------- data helpers ----------
function monthsAll(){ // всі місяці з активністю, зростанням
  const s=new Set();
  S.data.items.forEach(i=>{ if(i.buy_date)s.add(mkey(i.buy_date)); if(i.sell_date)s.add(mkey(i.sell_date)); });
  s.add(mkey(S.data.today));
  return [...s].sort();
}
// Агрегація по ПРОДАЖАХ (не по товарах) — партія може продаватись частинами
// й у різні місяці. Виручка/прибуток рахуються за кожен продаж окремо.
function monthAgg(key){
  const items=S.data.items;
  const isAll = key==='all';
  let profit=0, revenue=0, expenses=0, invested=0, soldUnits=0;
  const daysArr=[];
  items.forEach(it=>{
    const q=it.qty||1;
    (it.sales||[]).forEach(s=>{
      if(isAll || mkey(s.date)===key){
        revenue+=s.price; profit+=s.profit; soldUnits+=s.qty;
        invested += (s.unit_cost??it.unit_cost??0)*s.qty;
        expenses += (it.expenses_total||0)*(q? s.qty/q : 0);
        if(s.days!=null) daysArr.push(s.days);
      }
    });
  });
  const bought = items.filter(i=> isAll || mkey(i.buy_date)===key);
  return {
    key, sold:soldUnits, bought:bought.length, profit, revenue, invested, expenses,
    avgDays: daysArr.length? daysArr.reduce((a,b)=>a+b,0)/daysArr.length : 0,
    margin: invested>0? profit/invested*100 : 0,
    active: items.filter(i=>(i.remaining||0)>0).length,
    daysArr,
  };
}
function deltaFor(key){
  if(key==='all') return null;
  const all=monthsAll(); const idx=all.indexOf(key);
  if(idx<=0) return null;
  const cur=monthAgg(key), prev=monthAgg(all[idx-1]);
  if(!cur.sold || prev.profit<=0) return null;
  const diff=cur.profit-prev.profit;
  return {diff, pct:diff/prev.profit*100, prevLabel:mlabel(all[idx-1])};
}
function bestMonth(){
  const ms=monthsAll().map(monthAgg).filter(m=>m.sold>0);
  if(!ms.length) return null;
  return ms.reduce((a,b)=>b.profit>a.profit?b:a);
}

function goalCard(key){
  if(key==='all') return '';

    <div class="goal-sub">${done?'✅ Ціль досягнута — так тримати!':`ще ${money(left)} до цілі · ${Math.round(pct)}%`}</div>

}

// ---------- прогноз місяця ----------
// Куди вийде місяць, якщо темп збережеться. Числа рахує СЕРВЕР
// (db.forecast_stats) — щоб картка й недільний дайджест бота називали одне й
// те саме. Денна ставка — суміш фактичного темпу цього місяця й звичного за
// 90 днів, інакше одна вдала угода 3-го числа малює фантастичний прогноз.
function avgPrevMonths(n=3){
  const cm=mkey(S.data.today);
  const ms=monthsAll().filter(k=>k<cm).slice(-n).map(monthAgg).filter(m=>m.sold>0);
  if(!ms.length) return null;
  return {avg: ms.reduce((a,m)=>a+m.profit,0)/ms.length, n: ms.length};
}
function forecastCard(key){
  const fc=S.data.forecast;
  if(!fc || key!==fc.month) return '';            // має сенс лише для поточного місяця
  if(fc.profit<=0 && fc.projected<=0) return '';  // ні продажів, ні історії — нічого казати

  const scale=Math.max(fc.projected, fc.goal, fc.profit, 1);
  const pNow=Math.max(0,Math.min(100, fc.profit/scale*100));
  const pProj=Math.max(0,Math.min(100-pNow, (fc.projected-fc.profit)/scale*100));
  const pGoal=fc.goal>0 ? Math.max(0,Math.min(99.4, fc.goal/scale*100)) : null;
  const pctGoal=fc.goal>0 ? Math.round(fc.projected/fc.goal*100) : 0;

  let cls='', verdict='';
  if(fc.status==='done')
    verdict=`✅ Ціль закрита — вже <b>${money(fc.profit-fc.goal)}</b> зверху`, cls='ok';
  else if(fc.status==='ahead')
    verdict=`Ідеш із випередженням: за темпом це <b>${pctGoal}% цілі</b>`, cls='ok';
  else if(fc.status==='behind')
    verdict=`За темпом вийде <b>${pctGoal}% цілі</b> — бракує ${money(fc.left)}`+
            (fc.deals_left?` (~${fc.deals_left} ${plural(fc.deals_left,'угода','угоди','угод')})`:''), cls='bad';
  else
    verdict=`Ціль на місяць не поставлена — <b>постав</b>, і буде видно, чи встигаєш`;

  const ap=avgPrevMonths(3);
  const rows=[
    `<div class="stat-row"><div class="sl">Зароблено за ${fc.day} ${plural(fc.day,'день','дні','днів')}</div>
      <div class="sv">${money(fc.profit)}</div></div>`,
    `<div class="stat-row"><div class="sl">Темп цього місяця</div>
      <div class="sv">${money(fc.pace_day)}<span style="color:var(--faint)">/день</span></div></div>`,
  ];
  if(fc.need_day!=null && fc.status!=='done'){
    const ok=fc.need_day<=fc.rate;
    rows.push(`<div class="stat-row"><div class="sl">Треба до цілі</div>
      <div class="sv ${ok?'fast':'slow'}">${money(fc.need_day)}<span style="color:var(--faint)">/день</span></div></div>`);
  }
  if(ap) rows.push(`<div class="stat-row"><div class="sl">Сер. за ${ap.n} ${plural(ap.n,'попередній місяць','попередні місяці','попередніх місяців')}</div>
      <div class="sv">${money(ap.avg)}</div></div>`);

  const legend=`<div class="fc-legend">
    <span><i class="k-now"></i>факт ${money(fc.profit)}</span>
    <span><i class="k-proj"></i>прогноз ${money(fc.projected)}</span>
    ${fc.goal>0?`<span><i class="k-goal"></i>ціль ${money(fc.goal)}</span>`:''}
  </div>`;

  const note=fc.reliable
    ? `Прогноз = зароблене + звичний темп на ${fc.days_left} ${plural(fc.days_left,'день','дні','днів')}, що лишились.`
    : `Цього місяця ще мало угод, тож більше спираємось на твій звичний темп — цифра орієнтовна.`;

  const tap=fc.goal>0?'':' tap';
  const click=fc.goal>0?'':` onclick="openGoal('${fc.month}')"`;
  return `<section class="fc reveal${tap}"${click}>
    <div class="fc-head">
      <div class="eyebrow">📈 Прогноз на ${mlabel(fc.month).split(' ')[0]}</div>
      <div class="fc-day">${fc.day} / ${fc.days_total} дн</div>
    </div>
    <div class="fc-val"><span class="ap">≈</span>${money(fc.projected)}</div>
    <div class="fc-verdict ${cls}">${verdict}</div>
    <div class="fc-bar">
      <i class="now" style="width:${pNow}%"></i>
      <i class="proj" style="left:${pNow}%;width:${pProj}%"></i>
      ${pGoal!=null?`<i class="gm" style="left:${pGoal}%"></i>`:''}
    </div>
    ${legend}
    <div class="fc-rows">${rows.join('')}</div>
    <div class="fc-note ${fc.reliable?'':'warn'}">${note}</div>
  </section>`;
}

  if(key==='all'){ toast('Обери конкретний місяць','err'); return; }

  haptic(); toast('Готую звіт…');
  try{
    const r=await api('/api/export/month',{month:key});
    if(r&&r.ok){ hnotify('success'); toast('Звіт CSV надіслано в чат ✅','ok'); }

  }catch(e){ toast(e.message||'Не вдалося надіслати','err'); }
}

// Скільки грошей зараз «заморожено» в непроданому залишку партій.
function frozenStats(){
  const act=S.data.items.filter(i=>(i.remaining||0)>0);
  let total=0, units=0;
  act.forEach(i=>{ total += i.remaining_cost||0; units += i.remaining; });
  const held=act.filter(i=>i.days_held!=null).map(i=>i.days_held);
  const avgHeld=held.length? held.reduce((a,b)=>a+b,0)/held.length : 0;
  return {lines:act.length, count:units, units, total, avgHeld, avg: units? total/units : 0};
}
function plural(n,one,few,many){ const a=n%10,b=n%100; if(a===1&&b!==11)return one; if(a>=2&&a<=4&&(b<10||b>=20))return few; return many; }
function frozenCard(){
  const z=frozenStats();
  if(!z.units) return '';
  return `<section class="frozen reveal">
    <div class="snow">🧊</div>
    <div class="eyebrow">Заморожено в товарах</div>
    <div class="fz"><span class="cur">${CUR[S.cur]}</span>${fmtNum(conv(z.total))}</div>
    <div class="fzsub">${z.units} ${plural(z.units,'одиниця','одиниці','одиниць')} у наявності · сер. ${fmtNum(conv(z.avg))} ${CUR[S.cur]} · ${Math.round(z.avgHeld)} дн</div>
  </section>`;
}

function f(v,k,cls='',u='',onclick=''){ return `<div class="field ${cls}"${onclick?` onclick="${onclick}" style="cursor:pointer"`:''}><div class="fv">${v}${u?`<span class="u">${u}</span>`:''}</div><div class="fk">${k}</div></div>`; }
function fm(v,k,onclick=''){ return `<div class="field"${onclick?` onclick="${onclick}" style="cursor:pointer"`:''}><div class="fv" style="font-size:15px">${money(v)}</div><div class="fk">${k}</div></div>`; }

// період огляду ('all' або 'YYYY-MM') → ключ періоду товарів ('all' або 'm:YYYY-MM')
function ip(key){ return key==='all' ? 'all' : 'm:'+key; }
// тап по плашці показника — відкриває «Товари» з фільтром і тим самим періодом
function gotoItems(period, filter){
  haptic();
  S.itemsPeriod = period;

  S.tab = 'items';

function momentum(selKey){
  const ms=monthsAll().map(monthAgg);
  const maxP=Math.max(1,...ms.map(m=>m.profit));
  const sellMonths=ms.filter(m=>m.sold>0), buyMonths=ms.filter(m=>m.bought>0);
  const avgP=sellMonths.length?sellMonths.reduce((a,m)=>a+m.profit,0)/sellMonths.length:0;
  const avgB=buyMonths.length?buyMonths.reduce((a,m)=>a+m.bought,0)/buyMonths.length:0;
  const bars=ms.map(m=>{
    const h=m.profit>0?Math.max(6,m.profit/maxP*100):2;
    const sel=m.key===selKey;
    return `<div class="bar-col" onclick="setPeriod('${m.key}')">
      <div class="bar-val">${m.profit>0?(conv(m.profit)>=1000?fmtNum(conv(m.profit)/1000).replace(/\s/g,'')+'k':fmtNum(conv(m.profit))):'—'}</div>
      <div class="bar-track"><div class="bar ${m.profit<=0?'zero':''} ${sel&&m.profit>0?'sel':''}" style="height:${h}%"></div></div>
      <div class="bar-x ${sel?'sel':''}">${MON3[+m.key.split('-')[1]]}</div>
    </div>`;
  }).join('');
  return `<section class="section reveal">
    <div class="sec-head"><div class="eyebrow">Моментум · прибуток / міс</div></div>
    <div class="chart">${bars}</div>
    <div class="avg-line">
      <div class="a">сер. прибуток <b>${money(avgP)}</b>/міс</div>
      <div class="a">закупівель <b>${avgB.toFixed(1)}</b>/міс</div>
    </div>
  </section>`;
}

function bestCard(){
  const b=bestMonth(); if(!b) return '';
  return `<section class="best reveal">
    <div class="trophy">🏆</div>
    <div class="eyebrow">Кращий місяць</div>
    <div class="m">${mlabel(b.key)}</div>
    <div class="p">${money(b.profit)}</div>
  </section>`;
}

// ---------- Аналітика ----------
function kAmt(uah){ const v=conv(uah); return v>=1000 ? fmtNum(v/1000).replace(/\s/g,'')+'k' : fmtNum(v); }
function jumpMonth(k){ setPeriod(k); }  // тап по стовпчику → огляд того місяця
function median(arr){ if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b); const m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; }

// залежані: активні товари, що лежать довше за поріг (S.staleDays)
function staleItems(days){
  return S.data.items.filter(i=>(i.remaining||0)>0 && i.days_held!=null && i.days_held>=days)
    .sort((a,b)=>b.days_held-a.days_held);
}
function setStale(d){ S.staleDays=d; haptic(); render(); }
function staleSection(){
  const opts=[14,30,60];
  const list=staleItems(S.staleDays);
  const seg=`<div class="stale-seg">${opts.map(d=>`<button class="${S.staleDays===d?'on':''}" onclick="setStale(${d})">${d} дн</button>`).join('')}</div>`;
  let body;
  if(!list.length){ body=`<div class="empty" style="padding:20px 8px">Немає товарів, що лежать довше за ${S.staleDays} дн 👍</div>`; }
  else body=list.map(i=>`<div class="stale-row" onclick="openItem(${i.id})">
      <div style="min-width:0"><div class="sn">${esc(i.name)}</div><div class="sd">🕔 ${i.days_held} дн у наявності${i.qty>1?` · лишилось ${i.remaining} з ${i.qty}`:''}</div></div>
      <div class="sm">${money(i.remaining_cost||0)}</div></div>`).join('');
  return `<section class="section reveal">
    <div class="sec-head"><div class="eyebrow">🧊 Залежані товари</div>${seg}</div>
    ${body}</section>`;
}

function miniChart(label, ms, valFn, fmtFn, barCls){
  const vals=ms.map(valFn);
  const max=Math.max(1,...vals);
  const bars=ms.map((m,idx)=>{
    const v=vals[idx];
    const h=v>0?Math.max(6,v/max*100):2;
    return `<div class="bar-col" onclick="jumpMonth('${m.key}')">
      <div class="bar-val">${v>0?fmtFn(v):'—'}</div>
      <div class="bar-track"><div class="bar ${v>0?barCls:'zero'}" style="height:${h}%"></div></div>
      <div class="bar-x">${MON3[+m.key.split('-')[1]]}</div>
    </div>`;
  }).join('');
  return `<section class="section reveal">
    <div class="sec-head"><div class="eyebrow">${label}</div></div>
    <div class="chart">${bars}</div>
  </section>`;
}

const CAP_WINS=[['d90','90 днів'],['d365','рік'],['all','весь час']];
function setCapWin(w){ S.capWin=w; haptic(); render(); }
function capitalSection(){

// ---------- топ моделі за прибутком ----------
function topModels(n=5){
  const map=new Map();
  S.data.items.forEach(it=>{
    const key=it.name||'Без назви';
    (it.sales||[]).forEach(s=>{
      const cur=map.get(key)||{name:key, profit:0, units:0};
      cur.profit+=s.profit||0; cur.units+=s.qty||0;
      map.set(key,cur);
    });
  });
  return [...map.values()].filter(m=>m.units>0).sort((a,b)=>b.profit-a.profit).slice(0,n);
}
function viewModel(name){
  haptic();
  S.tab='items'; S.q=name; S.filter='all'; S.itemsPeriod='all'; S.itemsPlatform='all';

}
function topModelsCard(){

function analyticsView(){
  const allMs=monthsAll().map(monthAgg);
  const ms=allMs.slice(-8);                       // останні 8 міс — щоб стовпчики читались
  const allSales=[];
  S.data.items.forEach(it=>(it.sales||[]).forEach(s=>allSales.push({price:s.price, qty:s.qty, profit:s.profit, days:s.days, name:it.name})));
  const withDays=allSales.filter(s=>s.days!=null);
  const daysArr=withDays.map(s=>s.days);
  const avgDays=daysArr.length? daysArr.reduce((a,b)=>a+b,0)/daysArr.length : 0;
  const medDays=median(daysArr);
  const fastest=withDays.reduce((a,s)=> !a||s.days<a.days?s:a, null);
  const slowest=withDays.reduce((a,s)=> !a||s.days>a.days?s:a, null);
  const totalProfit=allSales.reduce((a,s)=>a+s.profit,0);
  const soldUnits=allSales.reduce((a,s)=>a+s.qty,0);
  const costBasis=allSales.reduce((a,s)=>a+(s.price-s.profit),0);   // = собівартість проданого
  const roi=costBasis>0? totalProfit/costBasis*100 : 0;

  if(!S.data.items.length){
    return header()+`<div class="empty" style="margin-top:24px">Ще немає даних для аналітики.<br>Додай перший товар на вкладці «Додати».</div>`;
  }

  const summary=`<div class="grid reveal">
    ${f(Math.round(avgDays),'Сер. час','hl','дн')}
    ${f(Math.round(medDays),'Медіана','','дн')}
    ${f(soldUnits,'Продано')}
    ${f(Math.round(roi),'ROI','','%')}
    ${fm(totalProfit,'Прибуток ∑')}
    ${fm(frozenStats().total,'Заморожено')}
  </div>`;

  const charts=
    miniChart('Прибуток / місяць', ms, m=>m.profit>0?m.profit:0, kAmt, '')+
    miniChart('Витрати / місяць', ms, m=>m.expenses, kAmt, 'exp')+
    miniChart('Сер. час продажу / місяць', ms, m=>m.avgDays, v=>Math.round(v)+'д', 'days')+
    miniChart('Продажів / місяць', ms, m=>m.sold, v=>v, 'rev');

  let insights='';
  if(withDays.length){
    insights=`<section class="section reveal">
      <div class="sec-head"><div class="eyebrow">Швидкість обороту</div></div>
      <div class="stat-row"><div class="sl">⚡ Найшвидший продаж<br><b>${esc(fastest.name)}</b></div><div class="sv fast">${fastest.days} дн</div></div>
      <div class="stat-row"><div class="sl">🐢 Найдовший продаж<br><b>${esc(slowest.name)}</b></div><div class="sv slow">${slowest.days} дн</div></div>
      <div class="stat-row"><div class="sl">📦 Заморожено зараз</div><div class="sv">${money(frozenStats().total)}</div></div>
      <div class="stat-row"><div class="sl">💰 Загальний прибуток</div><div class="sv" style="color:var(--mint)">${money(totalProfit)}</div></div>
    </section>`;
  }

  const cm=mkey(S.data.today);
  const exportBtn=`<button class="export-btn" onclick="exportMonth('${cm}')">⬇️ Надіслати CSV-звіт за ${mlabel(cm).split(' ')[0]} у чат</button>`;
  return header()+summary
    +`<div class="a-cap">Тапни стовпчик — відкриється огляд того місяця.</div>`
    +`<button class="export-btn" onclick="openAsk()">❓ Питання до даних</button>`
    +capitalSection()+topModelsCard()+charts+insights+staleSection()+exportBtn;
}

// ---------- пошук по товарах ----------
// Слова шукаються І-логікою по назві, бренду, моделі, комплекту й майданчику:
// «garmin epix» знайде «Garmin Epix Gen 2», а «дрон 2026» — за приміткою продажу.
function searchWords(){ return S.q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function itemHaystack(i){
  const notes=(i.sales||[]).map(s=>s.note).filter(Boolean).join(' ');
  const exps=(i.expenses||[]).map(e=>e.reason).filter(Boolean).join(' ');
  const attrs=Object.entries(i.attrs||{}).map(([f,v])=>fval(f,v)).join(' ');
  const vars=(i.variants||[]).map(v=>v.label).join(' ');
  return [i.name,i.category_name,attrs,vars,i.brand,i.model,i.kit,i.platform,i.origin_name,i.kind==='accessory'?'аксесуар комплект':'',notes,exps].filter(Boolean).join(' ').toLowerCase();
}
function matchQ(i,words){ if(!words.length) return true; const h=itemHaystack(i); return words.every(w=>h.includes(w)); }
function rxEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
// підсвітка збігів: спершу екрануємо HTML, потім вже підмінюємо у безпечному тексті
function hlName(name){
  const words=searchWords(), safe=esc(name);
  if(!words.length) return safe;
  const rx=new RegExp('('+words.map(rxEsc).join('|')+')','gi');
  return safe.replace(rx,'<span class="hit">$1</span>');
}
function onSearch(v){
  S.q=v;
  const box=document.getElementById('search-box');
  if(box) box.classList.toggle('has', !!v.trim());
  paintItems();                       // перемальовуємо ЛИШЕ список — поле не втрачає фокус
}
function clearSearch(){
  S.q='';
  const inp=document.getElementById('search-inp');
  if(inp){ inp.value=''; inp.focus(); }
  const box=document.getElementById('search-box');
  if(box) box.classList.remove('has');

}
// ---------- фільтр товарів за періодом (місяць / тиждень) ----------
// itemsPeriod: 'all' | 'm:YYYY-MM' | 'w:YYYY-MM-DD' (понеділок тижня)
function itemsPeriodRange(p){
  if(!p || p==='all') return null;
  if(p.startsWith('m:')){ const k=p.slice(2); return [k+'-01', k+'-31']; }
  if(p.startsWith('r:')){ const [f,t]=p.slice(2).split(':'); return [f,t]; }
  const k=p.slice(2); const b=new Date(k+'T00:00:00'); b.setDate(b.getDate()+6);
  return [k, isoOf(b)];
}
function inItemsPeriod(i, range){
  if(!range) return true;
  const [from,to]=range, inR=d=> d && d>=from && d<=to;
  if(inR(i.buy_date)) return true;
  return (i.sales||[]).some(s=>inR(s.date));
}
function setItemsMode(m){ if(S.itemsMode===m) return; S.itemsMode=m; S.itemsPeriod='all'; haptic(); render(); }
function setItemsPeriod(p){ S.itemsPeriod=p; haptic(); render(); }
function itemsPeriodChips(){

    <button class="${S.itemsMode==='m'?'on':''}" onclick="setItemsMode('m')">Місяці</button>
    <button class="${S.itemsMode==='w'?'on':''}" onclick="setItemsMode('w')">Тижні</button>
  </div>`;
  let chips='';
  if(S.itemsMode==='m'){
    const cm=mkey(S.data.today);
    chips+=`<button class="chip ${S.itemsPeriod==='m:'+cm?'on':''}" onclick="setItemsPeriod('m:${cm}')">Цей місяць</button>`;
    monthsAll().reverse().forEach(k=>{ if(k!==cm) chips+=`<button class="chip ${S.itemsPeriod==='m:'+k?'on':''}" onclick="setItemsPeriod('m:${k}')">${mlabel(k).split(' ')[0]}</button>`; });
  } else {
    weekKeysI().forEach((k,idx)=>{
      const lbl = idx===0 ? 'Цей тиждень' : weekLblI(k);
      chips+=`<button class="chip ${S.itemsPeriod==='w:'+k?'on':''}" onclick="setItemsPeriod('w:${k}')">${lbl}</button>`;
    });

  const rangeLbl = isRange ? (()=>{ const [f,t]=itemsPeriodRange(S.itemsPeriod); return isoUA(f)+'–'+isoUA(t); })() : '📅 Свій період';
  chips+=`<button class="chip ${isRange?'on':''}" onclick="openItemsRange()">${rangeLbl}</button>`;
  chips+=`<button class="chip ${S.itemsPeriod==='all'?'on':''}" onclick="setItemsPeriod('all')">Весь час</button>`;
  return seg+`<div class="chips">${chips}</div>`;

// ---------- фільтр за майданчиком ----------
function allPlatforms(){ return [...new Set((S.data.items||[]).map(i=>i.platform).filter(Boolean))]; }
function setItemsPlatform(p){ S.itemsPlatform=p; haptic(); render(); }
function itemsPlatformChips(){

// ---------- сортування товарів ----------
const ITEM_SORTS=[['date','Дата'],['profit','Прибуток'],['days','Дні'],['amount','Сума']];
function itemSortKey(i){
  switch(S.itemsSort){
    case 'profit': return i.profit||0;
    case 'days': return i.status==='sold' ? (i.days_to_sell??-1) : (i.days_held??-1);
    case 'amount': return i.status==='sold' ? (i.revenue||0) : (i.remaining_cost||0);
    default:
      if(String(S.itemsSort).startsWith('f:')){
        const nums=itemFieldVals(i,S.itemsSort.slice(2),false).map(Number).filter(n=>!isNaN(n));
        return nums.length?Math.max(...nums):-Infinity;
      }
      return null;
  }
}
function setItemsSort(s){ S.itemsSort=s; haptic(); render(); }
function itemsSortChips(){
  const c=typeof S.itemsCat==='number'?catById(S.itemsCat):null;
  const nf=c?c.fields.filter(f=>f.type==='number').map(f=>['f:'+f.id, '↓ '+esc(f.name)]):[];
  const chips=ITEM_SORTS.concat(nf).map(([k,l])=>`<button class="chip ${S.itemsSort===k?'on':''}" onclick="setItemsSort('${k}')">${l}</button>`).join('');
  return `<div class="chips">${chips}</div>`;
}
// ---------- фільтр за категорією й полями ----------
function matchCat(i){
  if(S.itemsCat==='all') return true;
  if(S.itemsCat==='none') return !i.category_id;
  return i.category_id===S.itemsCat;
}
function matchAttrs(i){
  const conds=Object.entries(S.itemsAttr);
  if(!conds.length) return true;
  // «M + чорна» — шукаємо ОДИН варіант, де збігаються обидва (з полями партії)
  const onlyStock=S.filter==='active'||S.filter==='stale';
  const base=i.attrs||{};
  const cands=hasVariants(i)
    ? i.variants.filter(v=>!onlyStock||v.remaining>0).map(v=>({...base, ...v.attrs}))
    : [base];
  return cands.some(a=>conds.every(([fid,cond])=>{
    const v=a[String(fid)];
    if(v==null) return false;
    if(cond&&typeof cond==='object'){
      const n=Number(v), lo=cond.from===''||cond.from==null?-Infinity:+cond.from, hi=cond.to===''||cond.to==null?Infinity:+cond.to;
      return !isNaN(n)&&n>=lo&&n<=hi;
    }
    return v===cond;
  }));
}
function setItemsCat(c){ S.itemsCat=c; S.itemsAttr={}; if(String(S.itemsSort).startsWith('f:')) S.itemsSort='date'; haptic(); render(); }
// значення поля серед товарів обраної категорії — для чипів-фільтрів
function fieldValuesInUse(fid){
  const set=new Set();
  S.data.items.filter(matchCat).forEach(i=>itemFieldVals(i,fid,false).forEach(v=>set.add(v)));
  const f=fieldMeta(fid), arr=[...set];
  if(f&&f.type==='number') return arr.sort((a,b)=>a-b);
  // список — у порядку значень поля (S, M, L), решта — за алфавітом
  const c=catById(f&&f.category_id), fo=c&&c.fields.find(x=>x.id===+fid);
  const order=new Map((fo?fo.options:[]).map((o,idx)=>[o.value,idx]));
  return arr.sort((a,b)=>(order.get(a)??1e6)-(order.get(b)??1e6) || String(a).localeCompare(String(b),'uk'));
}
function setAttrFilter(fid, idx){
  const v=(S._fv[fid]||[])[idx];
  if(S.itemsAttr[fid]===v || v===undefined) delete S.itemsAttr[fid]; else S.itemsAttr[fid]=v;
  haptic(); render();
}
function setRangeFilter(fid, which, v){
  const cur=(S.itemsAttr[fid]&&typeof S.itemsAttr[fid]==='object')?S.itemsAttr[fid]:{from:'',to:''};
  cur[which]=v;
  if(cur.from===''&&cur.to==='') delete S.itemsAttr[fid]; else S.itemsAttr[fid]=cur;
  paintItems();
}
function itemsCatChips(){
  const cs=cats();
  if(!cs.length && S.data.viewing) return '';
  const unc=uncategorized().length;
  let chips=`<button class="chip ${S.itemsCat==='all'?'on':''}" onclick="setItemsCat('all')">Усі категорії</button>`;
  chips+=cs.map(c=>`<button class="chip ${S.itemsCat===c.id?'on':''}" onclick="setItemsCat(${c.id})">${esc(c.name)}</button>`).join('');
  if(cs.length && unc) chips+=`<button class="chip ${S.itemsCat==='none'?'on':''}" onclick="setItemsCat('none')">Без категорії</button>`;
  if(!S.data.viewing) chips+=`<button class="chip ghost" onclick="openCats()">${cs.length?'⚙ Категорії':'＋ Категорії'}</button>`;
  return `<div class="chips">${chips}</div>`;
}
function itemsFieldFilters(){
  const c=typeof S.itemsCat==='number'?catById(S.itemsCat):null;
  if(!c) return '';
  S._fv={};
  return c.fields.map(f=>{
    const vals=fieldValuesInUse(f.id);
    if(f.type==='number'){
      if(!vals.length) return '';
      const cur=(S.itemsAttr[f.id]&&typeof S.itemsAttr[f.id]==='object')?S.itemsAttr[f.id]:{from:'',to:''};
      return `<div class="flt-name">${esc(f.name)}${f.unit?', '+esc(f.unit):''}</div><div class="range2">
        <input type="number" inputmode="decimal" placeholder="від ${esc(vals[0])}" value="${esc(cur.from)}" oninput="setRangeFilter(${f.id},'from',this.value)">
        <span>—</span>
        <input type="number" inputmode="decimal" placeholder="до ${esc(vals[vals.length-1])}" value="${esc(cur.to)}" oninput="setRangeFilter(${f.id},'to',this.value)"></div>`;
    }
    if(!vals.length || vals.length>40) return '';
    S._fv[f.id]=vals;
    return `<div class="flt-name">${esc(f.name)}</div><div class="chips" style="padding-bottom:8px">${vals.map((v,idx)=>
      `<button class="chip sm ${S.itemsAttr[f.id]===v?'on':''}" onclick="setAttrFilter(${f.id},${idx})">${esc(fval(f.id,v))}</button>`).join('')}</div>`;
  }).join('');
}
function visibleItems(){
  const words=searchWords();
  const range=itemsPeriodRange(S.itemsPeriod);
  const list=[...S.data.items]
    .filter(i=>
      S.filter==='all' ? true :
      S.filter==='stale' ? ((i.remaining||0)>0 && i.days_held!=null && i.days_held>=S.staleDays) :
      S.filter==='active' ? (i.remaining||0)>0 :
      i.status===S.filter)
    .filter(i=>S.itemsPlatform==='all' || i.platform===S.itemsPlatform)
    .filter(matchCat)
    .filter(matchAttrs)
    .filter(i=>inItemsPeriod(i,range))
    .filter(i=>matchQ(i,words));
  if(S.itemsSort==='date' || !S.itemsSort)
    list.sort((a,b)=> (b.buy_date||'').localeCompare(a.buy_date||'') || b.id-a.id);
  else
    list.sort((a,b)=> (itemSortKey(b)-itemSortKey(a)) || b.id-a.id);
  return list;
}

function itemDisplayProfit(i){
  if(!i.sales||!i.sales.length) return i.profit;
  const seen=new Set();
  let p=0, bundled=false;
  i.sales.forEach(s=>{
    const g=s.group_id||s.id;
    if(seen.has(g)) return;
    seen.add(g);
    if(s.mates&&s.mates.length){ p+=s.bundle_profit; bundled=true; }
    else p+=s.profit||0;
  });
  return bundled?p:i.profit;
}
function itemRow(i){
  const st=i.status, multi=i.qty>1, acc=i.kind==='accessory';
  let ic, meta, amt='';
  if(st==='sold' && i.included_only){
    ic='🧩';
    const wn=(i.sales[0]&&i.sales[0].with_name)||'іншим товаром';
    meta=`разом з ${esc(wn)} · ${isoUA(i.sell_date)}`;
    amt=`<div class="n" style="color:var(--muted)">в комплекті</div><div class="t">продано</div>`;
  } else if(st==='sold'){
    ic='✅';
    meta=`${isoUA(i.buy_date)} → ${isoUA(i.sell_date)}${i.days_to_sell!=null?` · ${i.days_to_sell} дн`:''}${multi?` · ${i.qty} шт`:''}`;
  } else if(st==='partial'){
    ic='🔓';
    meta=`продано ${i.sold_qty}/${i.qty} · лишилось ${i.remaining}${i.days_held!=null?` · ${i.days_held} дн`:''}`;
    amt=`<div class="n inv">${money(i.remaining_cost||0)}</div><div class="t">залишок</div>`;
  } else {
    ic=acc?'🧩':'📦';
    meta=`${acc&&i.origin_name?`з комплекту «${esc(i.origin_name)}» · `:''}куплено ${isoUA(i.buy_date)}${multi?` · ${i.qty} шт`:''}${i.days_held!=null?` · ${i.days_held} дн`:''}`;
    amt=`<div class="n inv">${money(i.remaining_cost||0)}</div><div class="t">вкладено</div>`;
  }
  const attrs=[i.category_name, i.brand, i.model].filter(Boolean).concat(attrPairs(i.attrs).map(p=>p[1]));
  const attrLine=attrs.length?`<div class="attr-line">${attrs.map(esc).join(' · ')}</div>`:'';
  const live=liveVariants(i);
  const stockLine=(live.length && st!=='sold')?`<div class="stock-line">${live.map(v=>`${esc(v.label)} ×${v.remaining}`).join(' · ')}</div>`:'';
  let soldLine='';
  if(st==='sold' && !i.included_only){
    const p=itemDisplayProfit(i);
    soldLine=`<div class="sold-line">Продано за ${money(i.revenue)} · <b class="${p<0?'neg':''}">${p<0?'−':'+'}${fmtNum(Math.abs(conv(p)))} ${CUR[S.cur]}</b></div>`;
  } else if(st==='partial'){
    soldLine=`<div class="sold-line">Продано за ${money(i.revenue)} · <b class="${i.profit<0?'neg':''}">${i.profit<0?'−':'+'}${fmtNum(Math.abs(conv(i.profit)))} ${CUR[S.cur]}</b></div>`;
  }
  const kitN=(i.kit_items||[]).length;
  return `<div class="item" onclick="openItem(${i.id})">
    <div class="ic">${ic}</div>
    <div class="info"><div class="nm">${hlName(i.name)}${multi?` <span style="color:var(--faint);font-weight:400">×${i.qty}</span>`:''}${acc?`<span class="kit-chip">аксесуар</span>`:''}${kitN?`<span class="kit-chip">+${kitN} у комплекті</span>`:''}</div>
      <div class="meta">${meta}</div>${attrLine}${stockLine}${soldLine}</div>
    ${amt?`<div class="amt">${amt}</div>`:''}
  </div>`;
}

function q(s){ return (s==null?'':String(s)).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
// ---------- категорія + поля + варіанти: спільний редактор для «Додати» (k='add')
// і «Редагувати» (k='ed'). Усі значення — довільні рядки користувача, тож в onclick
// передаємо лише id/індекси, а в розмітку — тільки через esc().
function blankVRow(){ return {attrs:{}, qty:'1', price:''}; }
function emptyAdd(){ return {cat:null, name:'', attrs:{}, vrows:[], extra:{}, newOpt:null, newCat:false,
  price:'', date:'', plat:'OLX', exp:'', qty:'', parts:[]}; }
function MS(k){ return S[k]; }
function metaRerender(k){ if(k==='add') rerenderAdd(); else if(k==='ed') paintEdit(); else renderArrange(); }
function catFieldsOf(id){ const c=id!=null?catById(id):null; return c?c.fields:[]; }
function plainFields(k){ return catFieldsOf(MS(k).cat).filter(f=>!f.is_variant || k.startsWith('arr_')); }
function varFields(k){ return k.startsWith('arr_') ? [] : catFieldsOf(MS(k).cat).filter(f=>f.is_variant); }
function fieldById(k,fid){ return catFieldsOf(MS(k).cat).find(f=>f.id===+fid); }
// значення списку: збережені + щойно додані у цій формі (на сервер підуть разом із товаром)
function fieldOpts(k,fid){
  const f=fieldById(k,fid), base=f?f.options.map(o=>o.value):[];
  const low=new Set(base.map(v=>v.toLowerCase()));
  return base.concat(((MS(k).extra||{})[fid]||[]).filter(v=>!low.has(v.toLowerCase())));
}
function pickCat(k,id){
  const M=MS(k);
  M.cat = (M.cat===id) ? null : id;
  M.attrs={}; M.newOpt=null;
  if(k==='add') M.vrows = varFields(k).length ? [blankVRow()] : [];
  else if(!M.vrows.some(r=>r.id) ) M.vrows=[];
  haptic(); metaRerender(k);
}
function setAttr(k,fid,v){ const M=MS(k); if(v===''||v==null) delete M.attrs[fid]; else M.attrs[fid]=v; }
function pickOpt(k,fid,idx){
  const M=MS(k), v=fieldOpts(k,fid)[idx];
  if(M.attrs[fid]===v) delete M.attrs[fid]; else M.attrs[fid]=v;
  haptic(); metaRerender(k);
}
// нове значення списку прямо у формі: для поля партії (row=-1) або клітинки варіанта
function startNewOpt(k,fid,row){ MS(k).newOpt={fid, row}; metaRerender(k);
  setTimeout(()=>{ const i=document.getElementById(`no-${k}`); if(i) i.focus(); },40); }
function cancelNewOpt(k){ MS(k).newOpt=null; metaRerender(k); }
function commitNewOpt(k){
  const M=MS(k), no=M.newOpt; if(!no) return;
  const v=val(`no-${k}`).slice(0,60);
  if(v){
    const have=fieldOpts(k,no.fid).find(x=>x.toLowerCase()===v.toLowerCase());
    const value=have||v;
    if(!have){ M.extra[no.fid]=(M.extra[no.fid]||[]).concat([v]); }
    if(no.row<0) M.attrs[no.fid]=value; else M.vrows[no.row].attrs[no.fid]=value;
  }
  M.newOpt=null; haptic(); metaRerender(k);
}
function newOptInput(k){
  return `<div class="inl"><input id="no-${k}" placeholder="нове значення" maxlength="60"
      onkeydown="if(event.key==='Enter'){event.preventDefault();commitNewOpt('${k}')}">
    <button class="btn primary" onclick="commitNewOpt('${k}')">✓</button>
    <button class="btn ghost" onclick="cancelNewOpt('${k}')">✕</button></div>`;
}
function catChipsHTML(k){
  const M=MS(k);
  const chips=cats().map(c=>`<button class="chip ${M.cat===c.id?'on':''}" onclick="pickCat('${k}',${c.id})">${esc(c.name)}</button>`).join('');

}
function plainFieldHTML(k,f){
  const M=MS(k), cur=M.attrs[f.id];
  const lbl=`<label>${esc(f.name)} <span class="opt">необов'язково</span></label>`;
  if(f.type==='list'){
    const opts=fieldOpts(k,f.id);
    const chips=opts.map((v,idx)=>`<button class="chip sm ${cur===v?'on':''}" onclick="pickOpt('${k}',${f.id},${idx})">${esc(v)}</button>`).join('');
    const adding=M.newOpt&&M.newOpt.fid===f.id&&M.newOpt.row<0;
    return lbl+`<div class="fwrap">${chips}<button class="chip sm ghost" onclick="startNewOpt('${k}',${f.id},-1)">＋</button></div>${adding?newOptInput(k):''}`;
  }
  if(f.type==='number'){
    return lbl+`<div class="unit-wrap"><input type="number" inputmode="decimal" placeholder="число" value="${esc(cur??'')}"
      oninput="setAttr('${k}',${f.id},this.value)">${f.unit?`<span class="un">${esc(f.unit)}</span>`:''}</div>`;
  }
  return lbl+`<input maxlength="120" placeholder="текст" value="${esc(cur??'')}" oninput="setAttr('${k}',${f.id},this.value.trim())">`;
}
function vCellHTML(k,r,f){
  const M=MS(k), cur=M.vrows[r].attrs[f.id];
  if(M.newOpt&&M.newOpt.fid===f.id&&M.newOpt.row===r) return `<div class="vf" style="flex-basis:100%">${newOptInput(k)}</div>`;
  if(f.type==='list'){
    const opts=fieldOpts(k,f.id);
    return `<div class="vf"><select onchange="setVCell('${k}',${r},${f.id},this)">
      <option value="">${esc(f.name)}</option>
      ${opts.map((v,idx)=>`<option value="${idx}" ${cur===v?'selected':''}>${esc(v)}</option>`).join('')}
      <option value="__new">＋ нове…</option></select></div>`;
  }
  const num=f.type==='number';
  return `<div class="vf"><input ${num?'type="number" inputmode="decimal"':'maxlength="120"'} placeholder="${esc(f.name)}${num&&f.unit?', '+esc(f.unit):''}"
    value="${esc(cur??'')}" oninput="setVInput('${k}',${r},${f.id},this.value.trim())"></div>`;
}
function setVCell(k,r,fid,sel){
  const M=MS(k);
  if(sel.value==='__new'){ startNewOpt(k,fid,r); return; }
  if(sel.value==='') delete M.vrows[r].attrs[fid];
  else M.vrows[r].attrs[fid]=fieldOpts(k,fid)[+sel.value];
}
function setVInput(k,r,fid,v){ const a=MS(k).vrows[r].attrs; if(v) a[fid]=v; else delete a[fid]; }
function addVRow(k){ const M=MS(k); const last=M.vrows[M.vrows.length-1];
  M.vrows.push(last?{attrs:{...last.attrs}, qty:'1', price:''}:blankVRow()); haptic(); metaRerender(k); }
function delVRow(k,r){ const M=MS(k); if(M.vrows[r].sold>0){ toast('Варіант з продажами не можна прибрати','err'); return; }
  M.vrows.splice(r,1); haptic(); metaRerender(k); }
function vrowsHTML(k){
  const M=MS(k), vf=varFields(k);
  if(!vf.length && !M.vrows.length) return '';
  const fields=vf;   // рядки без полів категорії (стара категорія) — показуємо підпис
  const rows=M.vrows.map((row,r)=>`<div class="vrow">
      ${fields.map(f=>vCellHTML(k,r,f)).join('')}
      ${!fields.length?`<div class="vf" style="color:var(--muted);font-size:13px">${esc(variantLabelLocal(row))||'Варіант '+(r+1)}</div>`:''}
      <input class="vq" type="number" inputmode="numeric" min="${row.sold||1}" placeholder="шт" value="${esc(row.qty)}" oninput="MS('${k}').vrows[${r}].qty=this.value;paintVHint('${k}')">
      <input class="vp" type="number" inputmode="decimal" placeholder="₴/шт" value="${esc(row.price)}" oninput="MS('${k}').vrows[${r}].price=this.value;paintVHint('${k}')">
      <button class="px" onclick="delVRow('${k}',${r})" aria-label="Прибрати">✕</button>
      ${row.sold?`<div class="vsold">продано ${row.sold} шт — менше не можна</div>`:''}
    </div>`).join('');
  return `<label>Варіанти і кількість</label>
    <div class="vtable">${rows||'<div class="vhint" style="padding:6px 0">Без варіантів — уся партія однакова.</div>'}
      <button class="linkish" onclick="addVRow('${k}')">＋ Варіант</button>
      <div class="vhint" id="vhint-${k}">${vHintText(k)}</div></div>`;
}
function variantLabelLocal(row){ return Object.entries(row.attrs||{}).map(([fid,v])=>fval(fid,v)).join(' '); }
// підказка: як рахується собівартість (ручні ціни, решта ділиться рівно)
function vHintText(k){
  const M=MS(k), rows=M.vrows;
  if(!rows.length) return '';
  const total=parseFloat(M.price)||0;
  let units=0, manual=0, restU=0;
  rows.forEach(r=>{ const q=Math.max(1,parseInt(r.qty)||1); units+=q;
    const p=parseFloat(r.price); if(r.price!==''&&p>=0) manual+=p*q; else restU+=q; });
  let t=`Разом ${units} шт`;
  if(!total) return t+' · вкажи ціну партії — поділимо на штуки';
  if(manual>total) return `Ручні ціни (${fmtNum(manual)} ₴) більші за ціну партії`;
  if(manual>0 && restU) t+=` · ручні ${fmtNum(manual)} ₴, решта ${fmtNum(total-manual)} ₴ ÷ ${restU} = ${fmtNum((total-manual)/restU)} ₴/шт`;
  else if(!manual) t+=` · по ${fmtNum(total/units)} ₴/шт`;
  return t+'. Витрати ділимо на всі штуки.';
}
function paintVHint(k){ const h=document.getElementById('vhint-'+k); if(h) h.textContent=vHintText(k); }
function metaFieldsHTML(k){ return plainFields(k).map(f=>plainFieldHTML(k,f)).join('') + vrowsHTML(k); }
function cleanVRows(k){
  return MS(k).vrows.map(r=>({id:r.id||null, attrs:{...r.attrs}, qty:Math.max(r.sold||1, parseInt(r.qty)||1),
    unit_price: r.price!==''&&r.price!=null&&!isNaN(parseFloat(r.price)) ? parseFloat(r.price) : null}));
}

function addView(){
  if(!S.add) S.add=emptyAdd();
  const A=S.add;
  if(!A.date) A.date=S.data.today;
  if(A.cat!=null && !catById(A.cat)){ A.cat=null; A.attrs={}; A.vrows=[]; }
  // у категорії з варіантами завжди є хоча б один рядок (поля могли з'явитися щойно)
  if(varFields('add').length && !A.vrows.length) A.vrows=[blankVRow()];
  if(!varFields('add').length && A.vrows.length) A.vrows=[];
  const hasVar=varFields('add').length>0;
  return header()+`<section class="section reveal">
    <div class="eyebrow" style="margin-bottom:8px">Нова закупівля</div>
    <div class="form">
      <label>Категорія <span class="opt">необов'язково</span></label>
      ${catChipsHTML('add')}

      <label>Назва</label>
      <input id="a-name" maxlength="120" placeholder="напр. Футболка Nike / iPhone 13" value="${esc(A.name)}" oninput="S.add.name=this.value">

      ${metaFieldsHTML('add')}

      <div class="row" style="margin-top:14px">
        <div><label>Ціна за всю партію, ₴</label><input id="a-price" type="number" inputmode="decimal" placeholder="0" value="${esc(A.price)}" oninput="S.add.price=this.value;paintKitHint()"></div>
        <div><label>Дата купівлі</label><input id="a-date" type="date" value="${A.date}" oninput="S.add.date=this.value"></div>
      </div>
      <div class="row">
        <div><label>Майданчик</label><input id="a-plat" maxlength="60" placeholder="OLX / Інше" value="${esc(A.plat)}" oninput="S.add.plat=this.value"></div>
        ${hasVar ? '' : `<div><label>Кількість <span class="opt">партія</span></label><input id="a-qty" type="number" inputmode="numeric" min="1" placeholder="1" value="${esc(A.qty)}" oninput="S.add.qty=this.value"></div>`}
      </div>
      <label>Витрати на старті, ₴ <span class="opt">необов'язково</span></label>
      <input id="a-exp" type="number" inputmode="decimal" placeholder="напр. доставка, реклама OLX" value="${esc(A.exp)}" oninput="S.add.exp=this.value">

      ${partsBlock()}

      <div class="btn-row"><button class="btn primary" onclick="submitAdd()">➕ Додати товар</button></div>
    </div>
  </section>`;
}

// ---------- detail sheet ----------
function renderSheet(){
  const host=document.getElementById('sheet-host');
  if(S.modal==='cats') return renderCats();
  if(S.modal==='arrange') return renderArrange();
  if(S.modal==='ask') return renderAsk();
  if(S.openId==null){ host.innerHTML=''; return; }
  const i=S.data.items.find(x=>x.id===S.openId);
  if(!i){ S.openId=null; host.innerHTML=''; return; }
  const st=i.status, multi=i.qty>1, rem=i.remaining;
  const badge = st==='sold'?['sold','продано'] : st==='partial'?['active','частково'] : ['active','в наявності'];
  const exps = i.expenses.length
    ? i.expenses.map(e=>`<div class="exp-row"><span class="er">${esc(e.reason||'витрати')}</span><span class="ea">−${money(e.amount)}</span><button class="ex" onclick="delExpense(${e.id})">✕</button></div>`).join('')
    : `<div class="exp-none">поки без витрат</div>`;
  const salesList = (i.sales&&i.sales.length)
    ? i.sales.map(s=>{
        const mates=(s.mates||[]).map(m=>m.name).join(', ');
        const label=s.included?(s.with_name?`разом з ${s.with_name}`:(s.note||'у комплекті'))
          :(mates?`${s.note?s.note+' · ':''}з ${mates}`:(s.note||'продаж'));
        const shown=s.included?'в комплекті':('+'+money(s.price)+(mates?` · прибуток ${money(s.bundle_profit)}`:''));
        return `<div class="exp-row"><span class="er">${s.qty>1?`<b>${s.qty}×</b> `:''}${s.variant_label?`<b>${esc(s.variant_label)}</b> · `:''}${esc(label)} <span style="color:var(--faint)">${isoUA(s.date)}</span></span><span class="ea" style="color:${s.included?'var(--muted)':'var(--mint)'}">${shown}</span><button class="ex" onclick="delSale(${s.id})">✕</button></div>`;
      }).join('')
    : `<div class="exp-none">ще не продано</div>`;

  const buyCell = `<div class="d-cell"><div class="k">Куплено${multi?` · ${i.qty} шт`:''}</div><div class="v">${money(i.buy_price)}</div><div class="v sub">${isoUA(i.buy_date)}${multi?` · ${money(i.unit_cost)}/шт`:''}</div></div>`;
  let stateCell, mainCell;
  if(st==='sold' && i.included_only){
    const wn=(i.sales[0]&&i.sales[0].with_name)||'іншим товаром';
    stateCell=`<div class="d-cell"><div class="k">Продано</div><div class="v">в комплекті</div><div class="v sub">${isoUA(i.sell_date)}</div></div>`;
    mainCell=`<div class="d-cell wide"><div class="k">Собівартість пішла в продаж</div><div class="v" style="font-size:18px">${esc(wn)}</div><div class="v sub">${money(i.buy_price)} ураховано в прибутку того продажу</div></div>`;
  } else if(st==='sold'){
    stateCell=`<div class="d-cell"><div class="k">Продано / лишок</div><div class="v">${i.sold_qty} / ${rem}</div><div class="v sub">${i.days_held} дн</div></div>`;
    mainCell=`<div class="d-cell wide"><div class="k">Реалізовано · заморожено ще ${money(i.remaining_cost||0)}</div><div class="v pos" style="font-size:22px">${money(i.profit)}</div></div>`;
  } else {
    stateCell=`<div class="d-cell"><div class="k">Статус</div><div class="v" style="color:var(--amber)">В наявності</div><div class="v sub">${i.days_held} дн${multi?` · ${rem} шт`:''}</div></div>`;
    mainCell=`<div class="d-cell wide"><div class="k">Вкладено${multi?` (${rem} шт)`:''}</div><div class="v" style="font-size:22px;color:var(--sky)">${money(i.remaining_cost||0)}</div></div>`;
  }

  const sellBtn = rem>0 ? `<button class="btn mint" onclick="startSell(${i.id})">✅ ${multi?'Продати':'Продано'}</button>` : '';
  const actions = `${sellBtn}<button class="btn ghost" onclick="startEdit(${i.id})">✏️ Редагувати</button><button class="btn danger" onclick="askDelete(${i.id})">🗑</button>`;
  const originLine = i.origin_name ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">🧩 Прийшов у комплекті з «${esc(i.origin_name)}»</div>` : '';
  const kitChips=(i.kit_items||[]).map(k=>`<button class="chip" onclick="openItem(${k.id})">${esc(k.name)} · ${k.remaining>0?'в наявності':'продано'}</button>`).join('');
  const kitList = `<div style="margin-top:10px">${kitChips}${rem>0?`<button class="chip" onclick="startSplit(${i.id})">＋ Аксесуар з комплекту</button>`:''}</div>`;

  host.innerHTML=`<div class="overlay" id="ovl" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="grab"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <h2>${esc(i.name)}${multi?` <span style="color:var(--faint);font-weight:500;font-size:16px">×${i.qty}</span>`:''}</h2>
        <span class="badge ${badge[0]}">${badge[1]}</span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${i.category_name?esc(i.category_name)+' · ':''}${i.platform?esc(i.platform)+' · ':''}куплено ${isoUA(i.buy_date)}</div>
      ${i.kit?`<div style="font-size:12px;color:var(--muted);margin-top:6px">📦 ${esc(i.kit)}</div>`:''}
      ${originLine}
      ${kitList}
      ${itemInfoHTML(i)}
      <div class="d-grid">${buyCell}${stateCell}${mainCell}</div>
      ${variantsInfoHTML(i)}
      <div class="exp-head"><div class="eyebrow">Продажі ${i.revenue>0?'· +'+fmtNum(conv(i.revenue))+' '+CUR[S.cur]:''}</div>
        ${rem>0?`<button class="chip" style="padding:6px 12px" onclick="startSell(${i.id})">+ Продаж</button>`:''}</div>
      ${salesList}
      <div class="exp-head"><div class="eyebrow">Витрати ${i.expenses_total>0?'· −'+fmtNum(conv(i.expenses_total))+' '+CUR[S.cur]:''}</div>
        <button class="chip" style="padding:6px 12px" onclick="startExpense(${i.id})">+ Витрата</button></div>
      ${exps}
      <div id="sheet-form"></div>
      <div class="btn-row">${actions}</div>
      <div style="margin-top:9px"><button class="btn ghost" onclick="closeSheet()">Закрити</button></div>
    </div>
  </div>`;
  requestAnimationFrame(()=>{ const o=document.getElementById('ovl'); if(o) o.classList.add('on'); });
  setTimeout(()=>{ const o=document.getElementById('ovl'); if(o&&!o.classList.contains('on'))o.classList.add('on'); },60);
}

// поля партії (і старі бренд/модель — у товарів, доданих до категорій, як є)
function itemInfoHTML(i){
  const pairs=[];
  if(i.brand) pairs.push(['Бренд', i.brand]);
  if(i.model) pairs.push(['Модель', i.model]);
  attrPairs(i.attrs).forEach(p=>pairs.push(p));
  if(!pairs.length) return '';
  return `<div class="section" style="background:var(--panel-2);padding:4px 14px;margin:14px 0 0">
    ${pairs.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
}
function variantsInfoHTML(i){
  if(!hasVariants(i)) return '';
  const rows=i.variants.map(v=>`<div class="kv"><span class="k" style="color:var(--text)">${esc(v.label)}
      <span style="color:var(--faint)">· ${money(v.unit_cost)}/шт${v.unit_price!=null?' (ручна)':''}</span></span>
      <span class="v" style="color:${v.remaining>0?'var(--sky)':'var(--faint)'}">${v.remaining>0?`${v.remaining} з ${v.qty} шт`:'продано'}</span></div>`).join('');
  return `<div class="eyebrow" style="margin:4px 0 6px">Варіанти · залишок</div>
    <div class="section" style="background:var(--panel-2);padding:4px 14px">${rows}</div>`;
}

function companionItems(exceptId){
  return (S.data.items||[]).filter(x=>x.id!==exceptId && (x.remaining||0)>0)
    .sort((a,b)=> (a.kind==='accessory'?0:1)-(b.kind==='accessory'?0:1) || String(a.name).localeCompare(b.name,'uk'));
}
function startSell(id, vid){
  const i=S.data.items.find(x=>x.id===id); if(!i) return;
  // перемальовуємо форму при виборі варіанта — не губимо вже введене
  const keep={price:val('s-price'), date:val('s-date'), note:val('s-note')};
  const live=liveVariants(i);
  if(live.length){
    if(vid!==undefined) S.sellVar=vid;
    if(!live.some(v=>v.id===S.sellVar)) S.sellVar = live.length===1 ? live[0].id : null;
  } else S.sellVar=null;
  const curVar=live.find(v=>v.id===S.sellVar);
  const today=keep.date||S.data.today;
  const rem=curVar?curVar.remaining:i.remaining, multi=curVar?rem>1:i.qty>1;
  const varBlock = live.length ? `<label>Варіант</label><div class="fwrap">${live.map(v=>
      `<button class="chip ${S.sellVar===v.id?'on':''}" onclick="startSell(${id},${v.id})">${esc(v.label)} · ${v.remaining} шт</button>`).join('')}</div>` : '';
  const comps=companionItems(id);
  const withBlock=comps.length
    ? `<label>Продати разом <span class="opt">аксесуар з цього чи іншого комплекту</span></label>
       <div>${comps.map(c=>`<label class="tog"><input type="checkbox" class="with-item" value="${c.id}">
         <span class="tn">${esc(c.name)}${c.qty>1?` <span style="color:var(--faint)">×${c.remaining}</span>`:''}
           <div class="tm">${c.origin_name?`з комплекту «${esc(c.origin_name)}» · `:''}собівартість ${fmtNum(c.unit_cost||c.buy_price)} ₴</div></span>
         ${c.remaining>1?`<input class="tq with-qty" data-id="${c.id}" type="number" inputmode="numeric" min="1" max="${c.remaining}" value="1">`:''}
       </label>`).join('')}</div>`
    : '';
  document.getElementById('sheet-form').innerHTML=`<div class="form" style="background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px">
    <div class="eyebrow">Продаж${multi?` · лишилось ${rem}`:''}</div>
    ${varBlock}
    ${live.length&&!curVar ? `<div class="kit-hint">Обери, який варіант продано.</div>` : `
    <div class="row" style="margin-top:4px">
      <div><label>Ціна продажу, ₴</label><input id="s-price" type="number" inputmode="decimal" placeholder="0" value="${esc(keep.price)}"></div>
      <div><label>Дата</label><input id="s-date" type="date" value="${esc(today)}"></div>
    </div>
    ${multi
      ? `<div class="row"><div><label>К-сть <span class="opt">макс ${rem}</span></label><input id="s-qty" type="number" inputmode="numeric" min="1" max="${rem}" value="${curVar?1:rem}"></div><div style="flex:1.5"><label>Примітка <span class="opt">необов'язково</span></label><input id="s-note" placeholder="напр. дрон / батарея" value="${esc(keep.note)}"></div></div>`
      : `<input id="s-qty" type="hidden" value="1"><label>Примітка <span class="opt">необов'язково</span></label><input id="s-note" placeholder="напр. з ременем" value="${esc(keep.note)}">`}
    ${withBlock}
    <div class="btn-row"><button class="btn mint" onclick="submitSell(${id})">Зберегти продаж</button></div>`}
  </div>`;
  const p=document.getElementById('s-price'); if(p&&!keep.price)p.focus();
}
function startSplit(id){
  const i=S.data.items.find(x=>x.id===id); if(!i) return;
  document.getElementById('sheet-form').innerHTML=`<div class="form" style="background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px">
    <div class="eyebrow">Виділити аксесуар з цієї закупки</div>
    <div class="kit-hint">Собівартість відріжеться від «${esc(i.name)}» (${fmtNum(i.buy_price)} ₴). Далі аксесуар можна продати окремо або з іншим товаром.</div>
    <label>Назва</label><input id="sp-name" placeholder="напр. Elite Strap">
    <div class="row"><div><label>Собівартість, ₴</label><input id="sp-price" type="number" inputmode="decimal" placeholder="менше ${fmtNum(i.buy_price)}"></div>
      <div><label>Кількість</label><input id="sp-qty" type="number" inputmode="numeric" min="1" value="1"></div></div>
    <div class="btn-row"><button class="btn primary" onclick="submitSplit(${id})">Виділити</button></div>
  </div>`;
  document.getElementById('sp-name').focus();
}

function startEdit(id){
  const i=S.data.items.find(x=>x.id===id); if(!i) return;
  S.ed={id, cat:i.category_id, attrs:{...(i.attrs||{})}, extra:{}, newOpt:null,
    vrows:(i.variants||[]).map(v=>({id:v.id, attrs:{...v.attrs}, qty:String(v.qty),
      price:v.unit_price!=null?String(v.unit_price):'', sold:v.sold})),
    hadVariants:hasVariants(i),
    name:i.name, price:String(i.buy_price), date:i.buy_date||S.data.today, plat:i.platform||'',
    qty:String(i.qty), kit:i.kit||'', soldQty:i.sold_qty||0};

  const n=document.getElementById('ed-name'); if(n)n.focus();

function startExpense(id){
  const today=S.data.today;
  document.getElementById('sheet-form').innerHTML=`<div class="form" style="background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px">

// ---------- actions / API ----------
async function api(path, body){
  const r=await fetch(BASE+path,{method:'POST',headers:{'Content-Type':'application/json',...NGROK_HDR},body:JSON.stringify(authBody(body))});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||'помилка');
  return r.json();
}
async function load(){
  const r=await fetch(BASE+'/api/state?'+authQS(),{cache:'no-store',headers:NGROK_HDR});
  if(r.status===401){
    document.getElementById('root').innerHTML=`<div class="skeleton">Відкрий застосунок через Telegram-бота, щоб побачити свою статистику.</div>`;
    return;
  }
  if(!r.ok){ toast('Сервер недоступний','err'); throw new Error('api '+r.status); }
  S.data=await r.json();
  if(S.period===null) S.period=mkey(S.data.today);
  const viewing=!!S.data.viewing;
  document.body.classList.toggle('viewing', viewing);
  if(viewing && S.tab==='add') S.tab='overview';
  render();
}

// ---------- чужа статистика (лише власник бота) ----------
function whoName(u){ return u.username ? '@'+u.username : (u.name||u.first_name||('id '+(u.id||u.user_id))); }
function openUsers(){
  const A=S.data.admin; if(!A) return;
  haptic();
  const cur=S.data.viewing ? S.data.viewing.user_id : A.me;
  const rows=A.users.map(u=>{
    const me=u.id===A.me;
    const sub=`${u.items} тов · ${u.sold} прод${u.seen?' · був '+esc(u.seen.slice(8,10)+'.'+u.seen.slice(5,7)+u.seen.slice(10)):''}`;
    return `<button class="u-row ${u.id===cur?'on':''}" onclick="pickUser(${me?'null':u.id})">
      <div><div class="nm">${me?'👤 Я':esc(whoName(u))}${u.name&&u.username&&!me?` <span style="color:var(--faint);font-weight:500">${esc(u.name)}</span>`:''}</div><div class="sub">${sub}</div></div>
      <div class="pf">${fmtNum(conv(u.profit))} ${CUR[S.cur]}</div></button>`;
  }).join('');
  const host=document.getElementById('sheet-host');
  host.innerHTML=`<div class="overlay" id="usr-ovl" onclick="if(event.target===this)closeUsers()">
    <div class="sheet">
      <div class="grab"></div>
      <h2>Чию статистику бачу</h2>
      <div style="font-size:13px;color:var(--faint);margin-bottom:6px">Видно лише тобі. Чужі дані — тільки перегляд, змінити їх не можна.</div>
      ${rows}
      <div style="margin-top:16px"><button class="btn ghost" onclick="closeUsers()">Закрити</button></div>
    </div>
  </div>`;
  requestAnimationFrame(()=>{const o=document.getElementById('usr-ovl'); if(o)o.classList.add('on');});
  setTimeout(()=>{const o=document.getElementById('usr-ovl'); if(o&&!o.classList.contains('on'))o.classList.add('on');},60);
}
function closeUsers(){ const o=document.getElementById('usr-ovl'); if(o){o.classList.remove('on'); setTimeout(()=>{document.getElementById('sheet-host').innerHTML='';},260);} }
async function pickUser(id){
  VIEW = id===null ? null : String(id);
  closeUsers(); haptic();
  S.openId=null; S.period=null; S.animKey=null;
  try{ await load(); toast(VIEW?'Перегляд: '+whoName(S.data.viewing||{id}):'Твоя статистика','ok'); }
  catch(e){ toast('Не вдалося завантажити','err'); }
}
function setTab(t){ if(S.tab===t)return; S.tab=t; haptic(); if(t!=='overview')S.animKey=null; render(); }
function setPeriod(k){ S.period=k; haptic(); if(S.tab!=='overview'){S.tab='overview';} render(); const r=document.getElementById('root'); if(r)r.scrollIntoView({block:'start'}); }
