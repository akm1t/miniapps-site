async function submitAdd(){
  const A=S.add;
  const name=(A.name||'').trim();
  const price=parseFloat(A.price), date=A.date||S.data.today;
  const plat=(A.plat||'').trim(), exp=parseFloat(A.exp);
  if(!name){ toast('Впиши назву товару','err'); return; }
  if(!price||price<=0){ toast('Введи ціну закупівлі','err'); return; }
  const variants=cleanVRows('add');
  const manual=variants.reduce((a,v)=>a+(v.unit_price!=null?v.unit_price*v.qty:0),0);
  if(manual>price+0.005){ toast('Ручні ціни варіантів більші за ціну партії','err'); return; }
  const qty = variants.length ? variants.reduce((a,v)=>a+v.qty,0) : Math.max(1, parseInt(A.qty)||1);
  const parts=(A.parts||[]).map(p=>({name:(p.name||'').trim(), buy_price:parseFloat(p.price)||0}))
    .filter(p=>p.name);
  const accSum=parts.reduce((a,p)=>a+p.buy_price,0);
  if(accSum>price){ toast('Собівартість аксесуарів більша за ціну купівлі','err'); return; }
  if(parts.length && accSum>=price){ toast('На основний товар має лишитися частина ціни','err'); return; }
  try{
    await api('/api/item/add',{name, buy_price:price, buy_date:date, platform:plat||null,
      qty, parts, category_id:A.cat, attrs:A.attrs, variants,
      expense_amount: exp>0?exp:0, expense_reason:'витрати на старті'});
    hnotify('success'); toast(parts.length?`Комплект додано ✅ (${parts.length} аксесуар${parts.length===1?'':'и'})`:(qty>1?`Партію ×${qty} додано ✅`:'Товар додано ✅'),'ok');
    const keepCat=A.cat;
    S.add=emptyAdd(); S.add.cat=keepCat;     // наступний товар — у ту саму категорію
    if(varFields('add').length) S.add.vrows=[blankVRow()];
    S.filter='active'; S.tab='items'; await load();
  }catch(e){ toast(e.message,'err'); }
}
async function submitSell(id){
  const price=parseFloat(val('s-price')), date=val('s-date')||S.data.today;
  const qty=Math.max(1, parseInt(val('s-qty'))||1), note=val('s-note');
  if(!price||price<=0){ toast('Введи ціну продажу','err'); return; }
  const with_items=[...document.querySelectorAll('#sheet-form input.with-item:checked')].map(cb=>{
    const q=document.querySelector(`#sheet-form .with-qty[data-id="${cb.value}"]`);
    return {id:+cb.value, qty:Math.max(1, parseInt(q&&q.value)||1)};
  });
  const it=S.data.items.find(x=>x.id===id);
  if(it&&liveVariants(it).length&&!S.sellVar){ toast('Обери варіант','err'); return; }
  try{ await api('/api/item/sell',{id, sell_price:price, sell_date:date, qty, note:note||null, with_items, variant_id:S.sellVar}); S.sellVar=null; hnotify('success'); toast(with_items.length?'Продаж комплектом збережено ✅':'Продаж збережено ✅','ok'); await load(); }
  catch(e){ toast(e.message,'err'); }
}
async function submitSplit(id){
  const name=val('sp-name'), price=parseFloat(val('sp-price')), qty=Math.max(1, parseInt(val('sp-qty'))||1);
  if(!name){ toast('Впиши назву аксесуара','err'); return; }
  if(!price||price<=0){ toast('Вкажи собівартість аксесуара','err'); return; }
  try{ await api('/api/item/split',{id, name, buy_price:price, qty}); hnotify('success'); toast('Аксесуар виділено ✅','ok'); await load(); }
  catch(e){ toast(e.message,'err'); }
}
async function submitEdit(id){
  const E=S.ed; if(!E) return;
  const name=(E.name||'').trim();
  if(!name){ toast('Назва не може бути порожня','err'); return; }
  const price=parseFloat(E.price);
  if(!price||price<=0){ toast('Некоректна ціна купівлі','err'); return; }
  const variants=cleanVRows('ed');
  const manual=variants.reduce((a,v)=>a+(v.unit_price!=null?v.unit_price*v.qty:0),0);
  if(manual>price+0.005){ toast('Ручні ціни варіантів більші за ціну партії','err'); return; }
  const body={id, name, buy_price:price, buy_date:E.date||S.data.today,
    platform:(E.plat||'').trim()||null, category_id:E.cat, attrs:E.attrs};
  if(variants.length || E.hadVariants) body.variants=variants;
  if(!variants.length) body.qty=Math.max(1,parseInt(E.qty)||1);
  if(E.kit!=='' || (S.data.items.find(x=>x.id===id)||{}).kit) body.kit=(E.kit||'').trim()||null;
  try{ await api('/api/item/update',body); hnotify('success'); toast('Зміни збережено ✅','ok'); S.ed=null; await load(); }
  catch(e){ toast(e.message,'err'); }
}

// усі продажі з контекстом: значення полів беремо з варіанта, а не лише з партії
function askSales(){
  const from=askFrom(), out=[];
  S.data.items.filter(askCatOk).forEach(i=>{
    const vmap={}; (i.variants||[]).forEach(v=>vmap[v.id]=v);
    (i.sales||[]).forEach(s=>{
      if(from && (!s.date || s.date<from)) return;
      const v=vmap[s.variant_id];
      out.push({i, s, cat:i.category_name||'Без категорії', qty:s.qty, price:s.price, profit:s.profit||0,
        cost:(s.unit_cost??i.unit_cost??0)*s.qty, days:s.days, included:s.included,
        vals:{...(i.attrs||{}), ...(v?v.attrs:{})}});
    });
  });
  return out;
}
function groupBy(rows, keyFn){
  const m=new Map();
  rows.forEach(r=>{ const k=keyFn(r); if(k==null||k==='') return;
    const g=m.get(k)||{key:k, units:0, profit:0, revenue:0, cost:0, days:[], n:0};
    g.units+=r.qty; g.profit+=r.profit; g.revenue+=r.price; g.cost+=r.cost; g.n++;
    if(r.days!=null && !r.included) g.days.push(r.days);
    m.set(k,g); });
  return [...m.values()].map(g=>({...g, avgDays:g.days.length?g.days.reduce((a,b)=>a+b,0)/g.days.length:null,
    markup:g.cost>0?g.profit/g.cost*100:null}));
}
function ansRows(list, valFn, subFn, barFn){
  if(!list.length) return `<div class="empty" style="padding:22px 8px">Замало даних для відповіді за цими параметрами.</div>`;
  const max=Math.max(1e-9,...list.map(x=>Math.abs(barFn(x))||0));
  return `<div class="section" style="background:var(--panel-2);padding:4px 14px">${list.map((x,idx)=>`<div class="ans-row">
    <div class="ans-top"><span class="an">${idx+1}. ${esc(x.label??x.key)}</span><span class="av">${valFn(x)}</span></div>
    <div class="ans-sub">${subFn(x)}</div>
    <div class="ans-bar"><i style="width:${Math.max(3,Math.abs(barFn(x)||0)/max*100)}%"></i></div></div>`).join('')}</div>`;
}
const pct=v=>v==null?'—':`${Math.round(v)}%`;
const dd=v=>v==null?'—':`${Math.round(v)} дн`;
function askAnswer(){
  const A=S.ask, catSel=typeof A.cat==='number'?catById(A.cat):null;
  const fld=A.field!=null&&catSel?catSel.fields.find(f=>f.id===A.field):null;
  if(A.q==='cat_profit'){
    const g=groupBy(askSales(), r=>r.cat).sort((a,b)=>b.profit-a.profit);
    const head=g.length?`<div class="ans-head">Найприбутковіша — <b>${esc(g[0].key)}</b>: ${money(g[0].profit)} за ${g[0].units} шт.</div>`:'';
    return head+ansRows(g, x=>money(x.profit), x=>`${x.units} шт · виручка ${money(x.revenue)} · націнка ${pct(x.markup)}`, x=>x.profit);
  }
  if(A.q==='fast'){
    const by = catSel||A.cat==='none' ? (r=>r.i.name) : (r=>r.cat);
    const g=groupBy(askSales().filter(r=>!r.included), by).filter(x=>x.avgDays!=null).sort((a,b)=>a.avgDays-b.avgDays);
    const head=g.length?`<div class="ans-head">Найшвидше йде <b>${esc(g[0].key)}</b> — у середньому ${dd(g[0].avgDays)} від купівлі до продажу.</div>`:'';
    return head+ansRows(g, x=>dd(x.avgDays), x=>`${x.n} ${plural(x.n,'продаж','продажі','продажів')} · медіана ${dd(median(x.days))} · націнка ${pct(x.markup)}`, x=>x.avgDays);
  }
  if(A.q==='field' || A.q==='markup'){
    if(A.q==='field' && !fld) return `<div class="ans-head">Обери категорію і поле — напр. «Розмір» чи «Пам'ять».</div>`;
    if(fld){
      const g=groupBy(askSales().filter(r=>!r.included), r=>r.vals[String(fld.id)]).map(x=>({...x, label:fval(fld.id,x.key)}));
      if(A.q==='field'){
        g.sort((a,b)=>(a.avgDays??1e9)-(b.avgDays??1e9));
        const head=g.length?`<div class="ans-head">${esc(fld.name)}: найшвидше продається <b>${esc(g[0].label)}</b> — ${dd(g[0].avgDays)}, націнка ${pct(g[0].markup)}.</div>`:'';
        return head+ansRows(g, x=>dd(x.avgDays), x=>`${x.units} шт · націнка ${pct(x.markup)} · прибуток ${money(x.profit)}`, x=>x.avgDays||0);
      }
      g.sort((a,b)=>(b.markup??-1e9)-(a.markup??-1e9));
      return `<div class="ans-head">Націнка = прибуток ÷ собівартість проданого, за значеннями поля «${esc(fld.name)}».</div>`+
        ansRows(g, x=>pct(x.markup), x=>`${x.units} шт · прибуток ${money(x.profit)} · собівартість ${money(x.cost)}`, x=>x.markup||0);
    }
    const g=groupBy(askSales().filter(r=>!r.included), r=>r.cat).sort((a,b)=>(b.markup??-1e9)-(a.markup??-1e9));
    return `<div class="ans-head">Націнка = прибуток ÷ собівартість проданого. Обери категорію й поле, щоб порівняти значення (напр. 128 ГБ проти 256 ГБ).</div>`+
      ansRows(g, x=>pct(x.markup), x=>`${x.units} шт · прибуток ${money(x.profit)}`, x=>x.markup||0);
  }
  if(A.q==='stale'){
    const list=S.data.items.filter(i=>askCatOk(i)&&(i.remaining||0)>0&&i.days_held!=null)
      .sort((a,b)=>b.days_held-a.days_held).slice(0,20).map(i=>({key:i.name, i}));
    const tot=S.data.items.filter(i=>askCatOk(i)&&(i.remaining||0)>0).reduce((a,i)=>a+(i.remaining_cost||0),0);
    return `<div class="ans-head">Зараз у наявності заморожено <b>${money(tot)}</b>.</div>`+
      ansRows(list, x=>dd(x.i.days_held), x=>`${x.i.remaining} шт · тримає ${money(x.i.remaining_cost||0)}${x.i.category_name?' · '+esc(x.i.category_name):''}`, x=>x.i.days_held);
  }
  if(A.q==='stock'){
    const items=S.data.items.filter(i=>askCatOk(i)&&(i.remaining||0)>0);
    if(!catSel){
      const m=new Map(); items.forEach(i=>{ const k=i.category_name||'Без категорії'; const g=m.get(k)||{key:k, units:0, cost:0};
        g.units+=i.remaining; g.cost+=i.remaining_cost||0; m.set(k,g); });
      const g=[...m.values()].sort((a,b)=>b.units-a.units);
      return `<div class="ans-head">Обери категорію, щоб побачити залишок по кожному варіанту.</div>`+
        ansRows(g, x=>`${x.units} шт`, x=>`на ${money(x.cost)}`, x=>x.units);
    }
    const m=new Map();
    items.forEach(i=>{ const live=liveVariants(i);
      if(live.length) live.forEach(v=>{ const g=m.get(v.label)||{key:v.label, units:0, cost:0, names:new Set()}; g.units+=v.remaining; g.cost+=v.remaining*v.unit_cost; g.names.add(i.name); m.set(v.label,g); });
      else { const k='без варіантів'; const g=m.get(k)||{key:k, units:0, cost:0, names:new Set()}; g.units+=i.remaining; g.cost+=i.remaining_cost||0; g.names.add(i.name); m.set(k,g); } });
    const g=[...m.values()].sort((a,b)=>b.units-a.units);
    const byField=catSel.fields.filter(f=>f.is_variant).map(f=>{
      const c=new Map(); items.forEach(i=>liveVariants(i).forEach(v=>{ const val=v.attrs[String(f.id)]; if(val!=null) c.set(val,(c.get(val)||0)+v.remaining); }));
      return c.size?`<div class="ans-head"><b>${esc(f.name)}:</b> ${[...c.entries()].sort((a,b)=>b[1]-a[1]).map(([v,n])=>`${esc(fval(f.id,v))} — ${n} шт`).join(' · ')}</div>`:'';
    }).join('');
    return byField+ansRows(g, x=>`${x.units} шт`, x=>`на ${money(x.cost)} · ${[...x.names].slice(0,3).map(esc).join(', ')}`, x=>x.units);
  }
  return '';
}
function renderAsk(){
  const A=S.ask;
  if(!A.q){
    showModal('ask-ovl', `<div class="grab"></div><h2>Питання</h2>
      <div style="font-size:12.5px;color:var(--muted);margin:2px 0 4px">Тапни питання — відповідь порахується з твоїх даних.</div>
      ${ASK_Q.map(q=>`<button class="q-row" onclick="askPick('${q.id}')">${q.t}</button>`).join('')}
      <div style="margin-top:16px"><button class="btn ghost" onclick="closeAsk()">Закрити</button></div>`, 'closeAsk');
    return;
  }
  const Q=ASK_Q.find(q=>q.id===A.q);
  if(typeof A.cat==='number' && !catById(A.cat)) A.cat='all';
  const catSel=typeof A.cat==='number'?catById(A.cat):null;
  let params='';
  if(Q.p.includes('period')) params+=`<div class="chips" style="padding-bottom:6px">${ASK_PER.map(([k,l])=>`<button class="chip sm ${A.period===k?'on':''}" onclick="askSet('period','${k}')">${l}</button>`).join('')}</div>`;
  if(Q.p.includes('cat')) params+=`<div class="chips" style="padding-bottom:6px"><button class="chip sm ${A.cat==='all'?'on':''}" onclick="askSet('cat','all')">Усі категорії</button>${cats().map(c=>`<button class="chip sm ${A.cat===c.id?'on':''}" onclick="askSet('cat',${c.id})">${esc(c.name)}</button>`).join('')}</div>`;
  if(Q.p.includes('field') && catSel) params+=`<div class="chips" style="padding-bottom:6px">${catSel.fields.map(f=>`<button class="chip sm ${A.field===f.id?'on':''}" onclick="askSet('field',${f.id})">${esc(f.name)}</button>`).join('')||'<span class="exp-none">У категорії немає полів</span>'}</div>`;
  showModal('ask-ovl', `<div class="grab"></div><button class="linkish" onclick="askPick(null)">‹ Усі питання</button>
    <h2 style="margin-top:6px;font-size:18px">${Q.t}</h2>${params}${askAnswer()}
    <div style="margin-top:16px"><button class="btn ghost" onclick="closeAsk()">Закрити</button></div>`, 'closeAsk');
}

// ---------- порівняння періодів ----------
const CMP={mode:'m', a:null, b:null};
function mondayOf(iso){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekKeysI(){ const s=new Set(); S.data.items.forEach(i=>{ if(i.buy_date)s.add(isoOf(mondayOf(i.buy_date))); if(i.sell_date)s.add(isoOf(mondayOf(i.sell_date))); }); s.add(isoOf(mondayOf(S.data.today))); return [...s].sort().reverse(); }
function weekLblI(k){ const a=new Date(k+'T00:00:00'), b=new Date(a); b.setDate(a.getDate()+6); const f=d=>d.getDate()+' '+MON3[d.getMonth()+1].toLowerCase(); return f(a)+' – '+f(b); }
function rangeAgg(from,to){
  const inR=d=>d&&d>=from&&d<=to;
  let profit=0,revenue=0,expenses=0,invested=0,soldUnits=0;
  S.data.items.forEach(it=>{
    const q=it.qty||1;
    (it.sales||[]).forEach(s=>{ if(inR(s.date)){
      revenue+=s.price; profit+=s.profit; soldUnits+=s.qty;
      invested+=(s.unit_cost??it.unit_cost??0)*s.qty; expenses+=(it.expenses_total||0)*(q?s.qty/q:0);
    }});
  });
  const bought=S.data.items.filter(i=>inR(i.buy_date));
  return {sold:soldUnits, bought:bought.length, profit, revenue, expenses, margin:invested>0?profit/invested*100:0};
}
function pKeys(){ return CMP.mode==='m' ? monthsAll().slice().reverse() : weekKeysI(); }
function pLbl(k){ return CMP.mode==='m' ? mlabel(k) : weekLblI(k); }
function pAgg(k){ if(CMP.mode==='m') return rangeAgg(k+'-01', k+'-31'); const b=new Date(k+'T00:00:00'); b.setDate(b.getDate()+6); return rangeAgg(k, isoOf(b)); }
function openCompare(){
  const keys=pKeys();
  if(keys.length<2){ toast('Замало даних для порівняння','err'); return; }
  if(!keys.includes(CMP.a)) CMP.a=keys[0];
  if(!keys.includes(CMP.b)||CMP.b===CMP.a) CMP.b=keys.find(k=>k!==CMP.a)||keys[1];
  haptic();
  const host=document.getElementById('sheet-host');
  host.innerHTML=`<div class="overlay" id="cmp-ovl" onclick="if(event.target===this)closeCompare()">
    <div class="sheet">
      <div class="grab"></div>
      <h2>Порівняння</h2>
      <div class="cmp-seg"><button id="cmp-bm" class="${CMP.mode==='m'?'on':''}" onclick="cmpMode('m')">Місяці</button><button id="cmp-bw" class="${CMP.mode==='w'?'on':''}" onclick="cmpMode('w')">Тижні</button></div>
      <div class="cmp-sel"><select id="cmp-a" onchange="CMP.a=this.value;cmpRender();haptic()"></select><span>до</span><select id="cmp-b" onchange="CMP.b=this.value;cmpRender();haptic()"></select></div>
      <div id="cmp-out"></div>
      <div style="margin-top:16px"><button class="btn ghost" onclick="closeCompare()">Закрити</button></div>
    </div>
  </div>`;
  cmpFill(); cmpRender();
  requestAnimationFrame(()=>{const o=document.getElementById('cmp-ovl'); if(o)o.classList.add('on');});
  setTimeout(()=>{const o=document.getElementById('cmp-ovl'); if(o&&!o.classList.contains('on'))o.classList.add('on');},60);
}
function cmpMode(m){
  if(CMP.mode===m)return;
  CMP.mode=m; const keys=pKeys(); CMP.a=keys[0]; CMP.b=keys[1]||keys[0];
  document.getElementById('cmp-bm').classList.toggle('on',m==='m');
  document.getElementById('cmp-bw').classList.toggle('on',m==='w');
  cmpFill(); cmpRender(); haptic();
}
function cmpFill(){
  const keys=pKeys();
  const opts=sel=>keys.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${pLbl(k)}</option>`).join('');
  document.getElementById('cmp-a').innerHTML=opts(CMP.a);
  document.getElementById('cmp-b').innerHTML=opts(CMP.b);
}
function cmpRender(){
  const A=pAgg(CMP.a), B=pAgg(CMP.b);
  const m_=v=>`${fmtNum(conv(v))} ${CUR[S.cur]}`;
  // dir: 1 = більше краще (зелений), -1 = більше гірше, 0 = нейтрально
  const rows=[
    ['Прибуток',A.profit,B.profit,m_,1],
    ['Виручка',A.revenue,B.revenue,m_,1],
    ['Витрати',A.expenses,B.expenses,m_,-1],
    ['Продано',A.sold,B.sold,v=>v+' шт',1],
    ['Куплено',A.bought,B.bought,v=>v+' шт',0],
    ['Маржа',Math.round(A.margin),Math.round(B.margin),v=>v+'%',1],
  ].map(([n,a,b,f,dir])=>{
    const d=a-b;
    const cls=(d!==0&&dir!==0)?(((d>0)===(dir>0))?'good':'bad'):'';
    const dTxt=d===0?'=':(d>0?'+':'−')+f(Math.abs(d));
    return `<div class="cmp-line"><span class="n">${n}</span><span class="v">${f(a)}</span><span class="v b">${f(b)}</span><span class="d ${cls}">${dTxt}</span></div>`;
  }).join('');
  document.getElementById('cmp-out').innerHTML=
    `<div class="cmp-head"><span></span><span class="v">${pLbl(CMP.a)}</span><span class="v">${pLbl(CMP.b)}</span><span class="d">Δ</span></div>${rows}`;
}
function closeCompare(){ const o=document.getElementById('cmp-ovl'); if(o){o.classList.remove('on'); setTimeout(()=>{document.getElementById('sheet-host').innerHTML='';},260);} }

// ---------- misc ----------
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastT;
function toast(msg,kind){ const t=document.getElementById('toast'); t.className='toast '+(kind||'')+' on'; t.textContent=msg;
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }

function gaugeTicks(){ let s='',cx=107,cy=107,rO=96,rIn=89,rMaj=85;
  for(let i=0;i<60;i++){ const a=i/60*2*Math.PI,maj=i%5===0,r2=maj?rMaj:rIn;
    s+=`<line class="tick${maj?' maj':''}" x1="${cx+Math.cos(a)*rO}" y1="${cy+Math.sin(a)*rO}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2}"/>`; }
  return s; }

function animateOverview(){
  const a=monthAgg(S.period);
  const numEl=document.getElementById('hero-num');
  const prog=document.querySelector('.prog');
  const R=78, CIRC=2*Math.PI*R, marginPct=Math.max(0,Math.min(a.margin,100));
  const target=conv(a.profit);
  const replay = S.animKey!==S.period;
  S.animKey=S.period;
  if(!numEl) return;
  if(RM || !replay){ numEl.textContent=fmtNum(target); if(prog){prog.style.transition='none';prog.style.strokeDashoffset=(CIRC*(1-marginPct/100)).toFixed(1);} return; }
  // count up
  let done=false; const fin=()=>{if(!done){done=true;numEl.textContent=fmtNum(target);}};
  const st=performance.now(), dur=900;
  (function step(t){ if(done)return; const p=Math.min((t-st)/dur,1); numEl.textContent=fmtNum(target*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(step); else fin(); })(performance.now());
  setTimeout(fin,dur+500);
  if(prog){ prog.style.strokeDashoffset=CIRC.toFixed(1); setTimeout(()=>{prog.style.strokeDashoffset=(CIRC*(1-marginPct/100)).toFixed(1);},120); }
}
